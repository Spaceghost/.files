# Installed as ~/.config/tmux/spaceghost-xiv.conf on each terminal host.
# The status job reads only a local cache. One collector runs where configured.
set -g status 2
set -g status-interval 5
set -g status-format[1] '#("$HOME/.local/bin/spaceghost-xiv-status" render #{client_width})'
run-shell -b '"$HOME/.local/bin/spaceghost-xiv-status" watch'
