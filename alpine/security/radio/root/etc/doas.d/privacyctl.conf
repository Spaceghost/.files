# Install as root:root, mode 0400.  Each command shape is intentionally exact.
permit nopass jack as root cmd /usr/local/sbin/privacyctl args status
permit nopass jack as root cmd /usr/local/sbin/privacyctl args status --json
permit nopass jack as root cmd /usr/local/sbin/privacyctl args off
permit nopass jack as root cmd /usr/local/sbin/privacyctl args scan
permit nopass jack as root cmd /usr/local/sbin/privacyctl args connect shmecklebucket
# After the exact local hotspot SSID is added to /etc/privacyctl/profiles,
# review and uncomment this separately:
# permit nopass jack as root cmd /usr/local/sbin/privacyctl args connect iphone-hotspot
