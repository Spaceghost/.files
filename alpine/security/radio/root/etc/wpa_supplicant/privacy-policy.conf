# Merge these global options into the active root-only wpa_supplicant config;
# this is deliberately not an include, because the live config's include
# semantics and path have not been changed or assumed here.
#
# passive_scan=1 is supported as a global option.  It requests passive scans.
passive_scan=1
# Disable Wi-Fi Direct/P2P discovery.
p2p_disabled=1
#
# For every allowlisted network block, set scan_ssid=0.  It is the documented
# default and prevents SSID-specific Probe Request frames for hidden SSIDs.
# Do not place credentials, quoted SSIDs, or network blocks in this repository.
