# Preview only: the production session and its compact gaps are untouched.
font pango:Inter Medium 11
default_border normal 0
default_floating_border normal 0
titlebar_position bottom
title_align left
titlebar_padding 18 7
titlebar_border_thickness 0
titlebar_separator disable
corner_radius 22
smart_corner_radius disable
shadows enable
shadow_blur_radius 34
shadow_color #1d2021b8
shadow_inactive_color #1d202190
shadow_offset 0 10
blur enable
blur_passes 2
blur_radius 4
blur_noise 0.01
blur_brightness 0.94
default_dim_inactive 0.02
animation_duration_ms 0
client.focused          #282828 #282828 #fabd2f #282828 #282828
client.focused_inactive #282828 #282828 #d5c4a1 #282828 #282828
client.unfocused        #282828 #282828 #bdae93 #282828 #282828

layer_effects "waybar" {
    blur enable
    blur_xray enable
    blur_ignore_transparent enable
    shadows enable
    corner_radius 18
}
