# Keep personal controls independent of theme colors and plugin managers.
source-file "$HOME/.config/tmux/oldbook.conf"

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g status-position top
set -g status-style "bg=#11111b,fg=#cdd6f4"
set -g message-style "bg=#45475a,fg=#d7def6"
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#f9e2af"
# Powerline chain: the status bar's own ground (#11111b, set above) stands in
# for "transparent" at both ends, since tmux always paints status-style
# behind everything. status-left is one chip (session name); status-right is
# two chips (whoami@host, then date/time). Both read left-to-right, so the
# same rounded separator (U+E0B4) is used throughout rather than mirroring it
# for the right side.
set -g status-left "#[fg=#f9e2af,bg=#11111b]#[fg=#11111b,bg=#f9e2af,bold] 󰆍 #S #[fg=#f9e2af,bg=#11111b]"
set -g status-right "#[fg=#94e2d5,bg=#11111b]#[fg=#11111b,bg=#94e2d5] #(whoami)@#H #[fg=#94e2d5,bg=#a6adc8]#[fg=#11111b,bg=#a6adc8] %a %d %b %H:%M #[fg=#a6adc8,bg=#11111b]"
set -g status-left-length 32
set -g status-right-length 60
setw -g window-status-format " #[fg=#6c7086]#I:#W "
# The current window keeps its existing highlighted pill, now capped with the
# same separator so it reads as a chip in the same family as the status-line
# segments either side of it.
setw -g window-status-current-format "#[fg=#45475a,bg=#11111b]#[fg=#d7def6,bg=#45475a,bold] #I:#W #[fg=#45475a,bg=#11111b]"
set -g clock-mode-colour "#f9e2af"
set -g mode-style "bg=#585b70,fg=#d7def6"

# Select the pane under the pointer without clicking.
set -g mouse on
set -g focus-follows-mouse on

# Forward the active pane title to Sway and the workspace decoration.
set -g set-titles on
set -g set-titles-string "#{pane_title}"
