[main]
selection-target=both
term=xterm-256color
font=JetBrainsMono Nerd Font:size=9.5
font-bold=JetBrainsMono Nerd Font:style=Bold:size=9.5
font-italic=JetBrainsMono Nerd Font:style=Italic:size=9.5
shell=zsh
pad=6x6 center
resize-delay-ms=40
initial-window-size-chars=106x30
initial-color-theme=dark

# Catppuccin Mocha: warm charcoal, cream text, and the original 16-color palette.
[colors-dark]
alpha=0.92
alpha-mode=all
foreground=cdd6f4
background=1e1e2e
selection-foreground=d7def6
selection-background=45475a
regular0=1e1e2e
regular1=af6881
regular2=7aa47c
regular3=b3a386
regular4=6784b9
regular5=947ab7
regular6=6ea3a0
regular7=a6adc8
bright0=6c7086
bright1=f38ba8
bright2=a6e3a1
bright3=f9e2af
bright4=89b4fa
bright5=cba6f7
bright6=94e2d5
bright7=cdd6f4
cursor=1e1e2e f9e2af
urls=89b4fa
jump-labels=1e1e2e f9e2af
scrollback-indicator=1e1e2e 89b4fa
search-box-no-match=1e1e2e f38ba8
search-box-match=1e1e2e a6e3a1

[csd]
preferred=server
# Matching fallback when another Wayland compositor supplies no decorations.
size=18
font=Inter:size=9
color=ff1e1e2e
border-width=0
border-color=ff45475a
button-color=ffcdd6f4
button-minimize-color=ff89b4fa
button-maximize-color=ffa6e3a1
button-close-color=fff38ba8

[tweak]
# Foot submits damage for only the cells that changed, which is the right thing
# to do and is why it is so cheap to run. SwayFX blurs what is behind a
# transparent window by sampling past the damaged region, so a partial damage
# rectangle leaves the blur recomputed against a stale scene and smeared along
# the window edges. Ghostty never showed it because it damages its whole
# surface every frame. This makes Foot do the same, which is what the option
# exists for.
damage-whole-window=yes
