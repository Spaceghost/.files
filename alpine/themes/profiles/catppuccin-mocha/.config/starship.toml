add_newline = false
format = "$username$hostname$directory${custom.fossil}$git_branch$git_status$cmd_duration$line_break$character"

[username]
show_always = true
style_user = "bold #f9e2af"
style_root = "bold #f38ba8"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "#94e2d5"
format = "[@$hostname]($style) "

[directory]
style = "bold #cdd6f4"
truncation_length = 4
truncate_to_repo = false
read_only = " 󰌾"

[git_branch]
symbol = "󰘬 "
style = "#cba6f7"

[git_status]
style = "#fab387"

[cmd_duration]
min_time = 500
format = " [󱎫 $duration]($style)"
style = "#89b4fa"

[character]
success_symbol = "[❯](bold #a6e3a1)"
error_symbol = "[❯](bold #f38ba8)"

[custom.fossil]
command = "fossil branch current"
when = "fossil info >/dev/null 2>&1"
format = " [󰜘 $output]($style)"
style = "bold #f9e2af"
shell = ["sh"]
