add_newline = false
# Powerline chain: each module below owns a background chip (bg:X fg:#11111b,
# Catppuccin's own crust, already used as the status bar's ground in .tmux.conf
# and waybar/style.css). The rounded separator is U+E0B4, written as the TOML
# escape \ue0b4: this chain once shipped with the raw glyph, a tool that drops
# private-use characters emptied every slot, and the prompt drew its chips with
# nothing between them. Between the chips that are always there -- username,
# hostname, directory -- it is coloured fg=previous chip's bg, bg=next chip's
# bg, so they read as one continuous ribbon, opened and closed the way
# .tmux.conf's chips are. The chips that come and go -- the Fossil branch, git,
# a slow command's duration -- each carry their own opening and closing cap
# inside a conditional group, so an absent module leaves nothing behind; named
# in the ribbon itself they left a tail of coloured stubs in every directory
# that was not a checkout. git_branch and git_status share one chip since
# git_status only ever appends to git_branch's own output.
format = "[\ue0b4](fg:#f9e2af)$username[\ue0b4](fg:#f9e2af bg:#94e2d5)$hostname[\ue0b4](fg:#94e2d5 bg:#89b4fa)$directory[\ue0b4](fg:#89b4fa)([\ue0b4](fg:#cba6f7)${custom.fossil}[\ue0b4](fg:#cba6f7))([\ue0b4](fg:#fab387)$git_branch$git_status[\ue0b4](fg:#fab387))([\ue0b4](fg:#a6e3a1)$cmd_duration[\ue0b4](fg:#a6e3a1))$line_break$character"
[username]
show_always = true
style_user = "bg:#f9e2af fg:#11111b bold"
style_root = "bg:#f38ba8 fg:#11111b bold"
format = "[ $user ]($style)"

[hostname]
ssh_only = false
style = "bg:#94e2d5 fg:#11111b"
format = "[ @$hostname ]($style)"

[directory]
style = "bg:#89b4fa fg:#11111b bold"
truncation_length = 4
truncate_to_repo = false
read_only = " 󰌾"
format = "[ $path$read_only ]($style)"

[git_branch]
symbol = "󰘬 "
style = "bg:#fab387 fg:#11111b"
format = "[ $symbol$branch ]($style)"

[git_status]
style = "bg:#fab387 fg:#11111b"
format = "([$all_status$ahead_behind ]($style))"

[cmd_duration]
min_time = 500
format = "[ 󱎫 $duration ]($style)"
style = "bg:#a6e3a1 fg:#11111b"

[character]
success_symbol = "[❯](bold #a6e3a1)"
error_symbol = "[❯](bold #f38ba8)"

[custom.fossil]
command = "fossil branch current"
when = "fossil info >/dev/null 2>&1"
format = "[ 󰜘 $output ]($style)"
style = "bg:#cba6f7 fg:#11111b bold"
shell = ["sh"]
