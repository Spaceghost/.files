# Catppuccin Mocha window chrome; keep session commands and shortcuts in sway/config.
# Tiled windows keep their clean edges; floating, stacked and tabbed views get titles.
seat * xcursor_theme Oldbook-Ghost 24
font pango:Inter 9.5
default_border pixel 0
default_floating_border normal 0
title_align left
titlebar_padding 18 7
titlebar_border_thickness 0

# Class                border  title bg text    indicator child border
client.focused          #313244 #313244 #f9e2af #f9e2af #1e1e2e
client.focused_inactive #1e1e2e #1e1e2e #bac2de #1e1e2e #1e1e2e
client.unfocused        #11111b #11111b #6c7086 #11111b #11111b
client.urgent           #1e1e2e #1e1e2e #f38ba8 #1e1e2e #1e1e2e
client.placeholder      #1e1e2e #1e1e2e #bac2de #1e1e2e #1e1e2e

gaps inner 6
gaps outer 7
