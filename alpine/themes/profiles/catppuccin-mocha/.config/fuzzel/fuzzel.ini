# Geometry is shared by all desktop menus. oldbook-fuzzel supplies active theme colors.
[main]
font=Inter:size=13
terminal=foot -e
prompt="Applications ❯ "
layer=overlay
lines=10
width=52
horizontal-pad=22
vertical-pad=20
inner-pad=14
line-height=28
image-size-ratio=0.55
icons-enabled=yes
fields=name,generic,comment,categories,filename,keywords
show-actions=yes

[colors]
background=1e1e2eff
text=cdd6f4ff
match=f9e2afff
selection=45475aff
selection-text=cdd6f4ff
selection-match=fab387ff
border=585b70ff

[border]
width=1
radius=22
