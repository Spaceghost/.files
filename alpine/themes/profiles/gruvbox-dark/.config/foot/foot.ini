[main]
term=xterm-256color
font=JetBrainsMono Nerd Font:size=9.5
font-bold=JetBrainsMono Nerd Font:style=Bold:size=9.5
font-italic=JetBrainsMono Nerd Font:style=Italic:size=9.5
shell=zsh
pad=18x14 center
resize-delay-ms=40
initial-window-size-chars=106x30
initial-color-theme=dark

# Gruvbox Dark: warm charcoal, cream text, and the original 16-color palette.
[colors-dark]
alpha=0.98
foreground=ebdbb2
background=282828
selection-foreground=fbf1c7
selection-background=504945
regular0=282828
regular1=cc241d
regular2=98971a
regular3=d79921
regular4=458588
regular5=b16286
regular6=689d6a
regular7=a89984
bright0=928374
bright1=fb4934
bright2=b8bb26
bright3=fabd2f
bright4=83a598
bright5=d3869b
bright6=8ec07c
bright7=ebdbb2
cursor=282828 fabd2f
urls=83a598
jump-labels=282828 fabd2f
scrollback-indicator=282828 83a598
search-box-no-match=282828 fb4934
search-box-match=282828 b8bb26

[csd]
preferred=server
# Matching fallback when another Wayland compositor supplies no decorations.
size=26
font=Inter:size=10
color=ff282828
border-width=0
border-color=ff504945
button-color=ffebdbb2
button-minimize-color=ff83a598
button-maximize-color=ffb8bb26
button-close-color=fffb4934
