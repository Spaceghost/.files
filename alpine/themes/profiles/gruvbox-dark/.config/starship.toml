add_newline = false
# Powerline chain: each module below owns a background chip (bg:X fg:#1d2021,
# the theme's own darkest ground, already used as the status bar's ground in
# .tmux.conf and waybar/style.css). The rounded separator is U+E0B4, written as
# the TOML escape \ue0b4: this chain once shipped with the raw glyph, a tool
# that drops private-use characters emptied every slot, and the prompt drew its
# chips with nothing between them. Between the chips that are always there --
# username, hostname, directory -- it is coloured fg=previous chip's bg, bg=next
# chip's bg, so they read as one continuous ribbon, opened and closed the way
# .tmux.conf's chips are. The chips that come and go -- the Fossil branch, git,
# a slow command's duration -- each carry their own opening and closing cap
# inside a conditional group, so an absent module leaves nothing behind; named
# in the ribbon itself they left a tail of coloured stubs in every directory
# that was not a checkout. git_branch and git_status share one chip since
# git_status only ever appends to git_branch's own output.
format = "[\ue0b4](fg:#fabd2f)$username[\ue0b4](fg:#fabd2f bg:#8ec07c)$hostname[\ue0b4](fg:#8ec07c bg:#83a598)$directory[\ue0b4](fg:#83a598)([\ue0b4](fg:#d3869b)${custom.fossil}[\ue0b4](fg:#d3869b))([\ue0b4](fg:#fe8019)$git_branch$git_status[\ue0b4](fg:#fe8019))([\ue0b4](fg:#b8bb26)$cmd_duration[\ue0b4](fg:#b8bb26))$line_break$character"
[username]
show_always = true
style_user = "bg:#fabd2f fg:#1d2021 bold"
style_root = "bg:#fb4934 fg:#1d2021 bold"
format = "[ $user ]($style)"

[hostname]
ssh_only = false
style = "bg:#8ec07c fg:#1d2021"
format = "[ @$hostname ]($style)"

[directory]
style = "bg:#83a598 fg:#1d2021 bold"
truncation_length = 4
truncate_to_repo = false
read_only = " 󰌾"
format = "[ $path$read_only ]($style)"

[git_branch]
symbol = "󰘬 "
style = "bg:#fe8019 fg:#1d2021"
format = "[ $symbol$branch ]($style)"

[git_status]
style = "bg:#fe8019 fg:#1d2021"
format = "([$all_status$ahead_behind ]($style))"

[cmd_duration]
min_time = 500
format = "[ 󱎫 $duration ]($style)"
style = "bg:#b8bb26 fg:#1d2021"

[character]
success_symbol = "[❯](bold #b8bb26)"
error_symbol = "[❯](bold #fb4934)"

[custom.fossil]
command = "fossil branch current"
when = "fossil info >/dev/null 2>&1"
format = "[ 󰜘 $output ]($style)"
style = "bg:#d3869b fg:#1d2021 bold"
shell = ["sh"]
