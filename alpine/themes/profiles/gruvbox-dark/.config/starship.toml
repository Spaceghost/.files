add_newline = false
# Powerline chain: each module below owns a background chip (bg:X fg:#1d2021,
# the theme's own darkest ground, already used as the status bar's ground in
# .tmux.conf and waybar/style.css). The rounded separator (U+E0B4) between
# chips is colored fg=previous chip's bg, bg=next chip's bg, so the chips read
# as one continuous ribbon with no gaps -- matching the rounded, pill-shaped
# module chrome already used in this theme's waybar. git_branch and
# git_status share one chip (no separator between them) since git_status only
# ever appends to git_branch's own output. The trailing separator after
# cmd_duration has no bg, fading the ribbon back to the terminal before the
# prompt's second line.
format = "[](fg:#fabd2f)$username[](fg:#fabd2f bg:#8ec07c)$hostname[](fg:#8ec07c bg:#83a598)$directory[](fg:#83a598 bg:#d3869b)${custom.fossil}[](fg:#d3869b bg:#fe8019)$git_branch$git_status[](fg:#fe8019 bg:#b8bb26)$cmd_duration[](fg:#b8bb26)$line_break$character"

[username]
show_always = true
style_user = "bg:#fabd2f fg:#1d2021 bold"
style_root = "bg:#fb4934 fg:#1d2021 bold"
format = "[ $user ]($style)"

[hostname]
ssh_only = false
style = "bg:#8ec07c fg:#1d2021"
format = "[ @$hostname ]($style)"

[directory]
style = "bg:#83a598 fg:#1d2021 bold"
truncation_length = 4
truncate_to_repo = false
read_only = " 󰌾"
format = "[ $path$read_only ]($style)"

[git_branch]
symbol = "󰘬 "
style = "bg:#fe8019 fg:#1d2021"
format = "[ $symbol$branch ]($style)"

[git_status]
style = "bg:#fe8019 fg:#1d2021"
format = "([$all_status$ahead_behind ]($style))"

[cmd_duration]
min_time = 500
format = "[ 󱎫 $duration ]($style)"
style = "bg:#b8bb26 fg:#1d2021"

[character]
success_symbol = "[❯](bold #b8bb26)"
error_symbol = "[❯](bold #fb4934)"

[custom.fossil]
command = "fossil branch current"
when = "fossil info >/dev/null 2>&1"
format = "[ 󰜘 $output ]($style)"
style = "bg:#d3869b fg:#1d2021 bold"
shell = ["sh"]
