add_newline = false
format = "$username$hostname$directory${custom.fossil}$git_branch$git_status$cmd_duration$line_break$character"

[username]
show_always = true
style_user = "bold #fabd2f"
style_root = "bold #fb4934"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "#8ec07c"
format = "[@$hostname]($style) "

[directory]
style = "bold #ebdbb2"
truncation_length = 4
truncate_to_repo = false
read_only = " 󰌾"

[git_branch]
symbol = "󰘬 "
style = "#d3869b"

[git_status]
style = "#fe8019"

[cmd_duration]
min_time = 500
format = " [󱎫 $duration]($style)"
style = "#83a598"

[character]
success_symbol = "[❯](bold #b8bb26)"
error_symbol = "[❯](bold #fb4934)"

[custom.fossil]
command = "fossil branch current"
when = "fossil info >/dev/null 2>&1"
format = " [󰜘 $output]($style)"
style = "bold #fabd2f"
shell = ["sh"]
