# SwayFX 0.6 only. Include after the shared Sway configuration.
# Ghost Observatory: warm charcoal glass, generous corners, soft deep shadows.
# Gaps are always shown, so corners stay rounded on every window.
corner_radius 22
smart_corner_radius disable
blur enable
blur_xray disable
blur_passes 2
blur_radius 4
blur_noise 0.012
blur_brightness 0.94
blur_contrast 1.03
blur_saturation 1.00
shadows enable
shadows_on_csd enable
shadow_blur_radius 34
shadow_color #1d2021b8
shadow_inactive_color #1d202190
shadow_offset 0 10
default_dim_inactive 0.02
dim_inactive_colors.unfocused #282828ff
titlebar_separator disable
animation_duration_ms 140

layer_effects "waybar" {
    blur enable
    blur_xray enable
    blur_ignore_transparent enable
    shadows enable
    corner_radius 18
}
layer_effects "swaync-control-center" {
    # The layer includes empty space; style only the actual cards in GTK CSS.
    blur disable
    blur_xray disable
    shadows disable
    corner_radius 0
}
layer_effects "swaync-notification-window" {
    # The layer includes empty space; style only the actual cards in GTK CSS.
    blur disable
    blur_xray disable
    shadows disable
    corner_radius 0
}
layer_effects "launcher" {
    blur enable
    blur_xray enable
    shadows enable
    corner_radius 18
}

# The power deck (wlogout) spans the output; frost the desktop behind its tint.
layer_effects "logout_dialog" {
    blur enable
    blur_xray enable
    shadows disable
    corner_radius 0
}

# GTK changes the strip corners for fullscreen and floating windows.
layer_effects "oldbook-decoration" {
    corner_radius 0
}

# Volume, brightness and keyboard-light feedback pill (oldbook-osd). The
# screenshot flash uses its own "oldbook-flash" namespace and stays plain.
layer_effects "oldbook-osd" {
    blur enable
    blur_xray enable
    blur_ignore_transparent enable
    shadows enable
    corner_radius 14
}
