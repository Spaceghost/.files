# SwayFX 0.6 only. Include after the shared Sway configuration.
# Warm charcoal glass; compact corners keep floating titlebars proportional.
corner_radius 6
smart_corner_radius enable
blur enable
blur_xray disable
blur_passes 2
blur_radius 4
blur_noise 0.018
blur_brightness 0.95
blur_contrast 1.03
blur_saturation 1.00
shadows enable
shadows_on_csd enable
shadow_blur_radius 24
shadow_color #1d2021c0
shadow_inactive_color #1d202180
shadow_offset 0 6
default_dim_inactive 0.03
dim_inactive_colors.unfocused #282828ff
titlebar_separator disable
animation_duration_ms 140

layer_effects "waybar" {
    blur enable
    blur_xray enable
    blur_ignore_transparent enable
    shadows enable
    corner_radius 12
}
layer_effects "swaync-control-center" {
    blur enable
    blur_xray enable
    shadows enable
    corner_radius 12
}
layer_effects "swaync-notification-window" {
    blur enable
    blur_xray enable
    shadows enable
    corner_radius 10
}
layer_effects "launcher" {
    blur enable
    blur_xray enable
    shadows enable
    corner_radius 12
}

# Clip all four corners of the standalone workspace information strip.
layer_effects "oldbook-decoration" {
    corner_radius 7
}
