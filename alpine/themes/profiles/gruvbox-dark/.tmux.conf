# Keep personal controls independent of theme colors and plugin managers.
source-file "$HOME/.config/tmux/oldbook.conf"

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g status-position top
set -g status-style "bg=#1d2021,fg=#ebdbb2"
set -g message-style "bg=#504945,fg=#fbf1c7"
set -g pane-border-style "fg=#504945"
set -g pane-active-border-style "fg=#fabd2f"
# Powerline chain: the status bar's own ground (#1d2021, set above) stands in
# for "transparent" at both ends, since tmux always paints status-style
# behind everything. status-left is one chip (session name); status-right is
# two chips (whoami@host, then date/time). Both read left-to-right, so the
# same rounded separator (U+E0B4) is used throughout rather than mirroring it
# for the right side.
set -g status-left "#[fg=#fabd2f,bg=#1d2021]#[fg=#1d2021,bg=#fabd2f,bold] 󰆍 #S #[fg=#fabd2f,bg=#1d2021]"
set -g status-right "#[fg=#8ec07c,bg=#1d2021]#[fg=#1d2021,bg=#8ec07c] #(whoami)@#H #[fg=#8ec07c,bg=#a89984]#[fg=#1d2021,bg=#a89984] %a %d %b %H:%M #[fg=#a89984,bg=#1d2021]"
set -g status-left-length 32
set -g status-right-length 60
setw -g window-status-format " #[fg=#928374]#I:#W "
# The current window keeps its existing highlighted pill, now capped with the
# same separator so it reads as a chip in the same family as the status-line
# segments either side of it.
setw -g window-status-current-format "#[fg=#504945,bg=#1d2021]#[fg=#fbf1c7,bg=#504945,bold] #I:#W #[fg=#504945,bg=#1d2021]"
set -g clock-mode-colour "#fabd2f"
set -g mode-style "bg=#665c54,fg=#fbf1c7"

# Forward the active pane title to Sway and the workspace decoration.
set -g set-titles on
set -g set-titles-string "#{pane_title}"
