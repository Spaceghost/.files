add_newline = false
format = "$username$hostname$directory${custom.fossil}$git_branch$git_status$cmd_duration$line_break$character"

[username]
show_always = true
style_user = "bold #dca7ff"
style_root = "bold #ff6f91"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "#9fe8ff"
format = "[@$hostname]($style) "

[directory]
style = "bold #f3e9fa"
truncation_length = 4
truncate_to_repo = false
read_only = " 󰌾"

[git_branch]
symbol = "󰘬 "
style = "#c48bf0"

[git_status]
style = "#ffb37a"

[cmd_duration]
min_time = 500
format = " [󱎫 $duration]($style)"
style = "#8ab6ff"

[character]
success_symbol = "[❯](bold #8fe3b0)"
error_symbol = "[❯](bold #ff6f91)"

[custom.fossil]
command = "fossil branch current"
when = "fossil info >/dev/null 2>&1"
format = " [󰜘 $output]($style)"
style = "bold #dca7ff"
shell = ["sh"]
