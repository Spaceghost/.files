[main]
selection-target=both
term=xterm-256color
font=JetBrainsMono Nerd Font:size=9.5
font-bold=JetBrainsMono Nerd Font:style=Bold:size=9.5
font-italic=JetBrainsMono Nerd Font:style=Italic:size=9.5
shell=zsh
pad=6x6 center
resize-delay-ms=40
initial-window-size-chars=106x30
initial-color-theme=dark

# Space Ghost: warm charcoal, cream text, and the original 16-color palette.
[colors-dark]
alpha=0.88
alpha-mode=all
foreground=f3e9fa
background=13091f
selection-foreground=f5edfb
selection-background=49315b
regular0=13091f
regular1=b34e6d
regular2=679d82
regular3=9c74b7
regular4=647fb7
regular5=8b61ad
regular6=72a1b7
regular7=b9a3cc
bright0=816b91
bright1=ff6f91
bright2=8fe3b0
bright3=dca7ff
bright4=8ab6ff
bright5=c48bf0
bright6=9fe8ff
bright7=f3e9fa
cursor=13091f dca7ff
urls=8ab6ff
jump-labels=13091f dca7ff
scrollback-indicator=13091f 8ab6ff
search-box-no-match=13091f ff6f91
search-box-match=13091f 8fe3b0

[csd]
preferred=server
# Matching fallback when another Wayland compositor supplies no decorations.
size=18
font=Inter:size=9
color=ff13091f
border-width=0
border-color=ff49315b
button-color=fff3e9fa
button-minimize-color=ff8ab6ff
button-maximize-color=ff8fe3b0
button-close-color=ffff6f91

[tweak]
# Foot submits damage for only the cells that changed, which is the right thing
# to do and is why it is so cheap to run. SwayFX blurs what is behind a
# transparent window by sampling past the damaged region, so a partial damage
# rectangle leaves the blur recomputed against a stale scene and smeared along
# the window edges. Ghostty never showed it because it damages its whole
# surface every frame. This makes Foot do the same, which is what the option
# exists for.
damage-whole-window=yes
