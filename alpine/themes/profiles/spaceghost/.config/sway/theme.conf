# Space Ghost window chrome; keep session commands and shortcuts in sway/config.
# Tiled windows keep their clean edges; floating, stacked and tabbed views get titles.
seat * xcursor_theme Oldbook-Ghost 24
font pango:Inter 9.5
default_border pixel 0
default_floating_border normal 0
title_align left
titlebar_padding 18 7
titlebar_border_thickness 0

# Class                border  title bg text    indicator child border
client.focused          #261631 #261631 #dca7ff #dca7ff #13091f
client.focused_inactive #13091f #13091f #e9d8f5 #13091f #13091f
client.unfocused        #0c0514 #0c0514 #816b91 #0c0514 #0c0514
client.urgent           #13091f #13091f #ff6f91 #13091f #13091f
client.placeholder      #13091f #13091f #e9d8f5 #13091f #13091f

gaps inner 6
gaps outer 7
