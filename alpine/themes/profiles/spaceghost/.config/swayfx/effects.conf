# SwayFX 0.6 only. Include after the shared Sway configuration.
# Violet glass with readable content; blur is intentionally modest at Retina scale.
corner_radius 14
smart_corner_radius enable
blur enable
blur_xray disable
blur_passes 2
blur_radius 4
blur_noise 0.018
blur_brightness 0.90
blur_contrast 1.03
blur_saturation 1.10
shadows enable
shadows_on_csd enable
shadow_blur_radius 28
shadow_color #080310c0
shadow_inactive_color #08031080
shadow_offset 0 8
default_dim_inactive 0.06
dim_inactive_colors.unfocused #160c24ff
titlebar_separator disable
animation_duration_ms 140

layer_effects "waybar" {
    blur enable
    blur_xray enable
    blur_ignore_transparent enable
    shadows enable
    corner_radius 20
}
layer_effects "swaync-control-center" {
    # The layer includes empty space; style only the actual cards in GTK CSS.
    blur disable
    blur_xray disable
    shadows disable
    corner_radius 0
}
layer_effects "swaync-notification-window" {
    # The layer includes empty space; style only the actual cards in GTK CSS.
    blur disable
    blur_xray disable
    shadows disable
    corner_radius 0
}
layer_effects "launcher" {
    blur enable
    blur_xray enable
    shadows enable
    corner_radius 20
}

# GTK changes the strip corners for fullscreen and floating windows.
layer_effects "oldbook-decoration" {
    corner_radius 0
}
