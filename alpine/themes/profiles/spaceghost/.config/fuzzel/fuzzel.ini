# Geometry is shared by all desktop menus. oldbook-fuzzel supplies active theme colors.
[main]
font=Inter:size=13
terminal=foot -e
prompt="Applications ❯ "
layer=overlay
lines=10
width=48
horizontal-pad=22
vertical-pad=20
inner-pad=14
line-height=28
image-size-ratio=0.55
icons-enabled=yes
fields=name,generic,comment,categories,filename,keywords
show-actions=yes

[colors]
background=13091fff
text=f3e9faff
match=dca7ffff
selection=49315bff
selection-text=f5edfbff
selection-match=ffb37aff
border=9c74b7ff

[border]
width=1
radius=22
