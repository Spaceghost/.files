# Keep personal controls independent of theme colors and plugin managers.
source-file "$HOME/.config/tmux/oldbook.conf"

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g status-position top
set -g status-style "bg=#0c0514,fg=#f3e9fa"
set -g message-style "bg=#49315b,fg=#f5edfb"
set -g pane-border-style "fg=#49315b"
set -g pane-active-border-style "fg=#dca7ff"
set -g status-left "#[fg=#dca7ff,bold] 󰆍 #S #[default]"
set -g status-right "#[fg=#9fe8ff]#(whoami)@#H #[fg=#b9a3cc]%a %d %b %H:%M "
set -g status-left-length 32
set -g status-right-length 60
setw -g window-status-format " #[fg=#816b91]#I:#W "
setw -g window-status-current-format "#[bg=#49315b,fg=#f5edfb,bold] #I:#W #[default]"
set -g clock-mode-colour "#dca7ff"
set -g mode-style "bg=#542476,fg=#f5edfb"

# Select the pane under the pointer without clicking.
set -g mouse on
set -g focus-follows-mouse on

# Forward the active pane title to Sway and the workspace decoration.
set -g set-titles on
set -g set-titles-string "#{pane_title}"
