# Preserve the historic C-a workflow when it has no plugin manager to bootstrap.
# A local overlay must never fetch TPM or any other runtime dependency.
if-shell 'test -f "$HOME/.files/.tmux.conf" && ! grep -Eq "tmux-plugins|/tpm" "$HOME/.files/.tmux.conf"' 'source-file "$HOME/.files/.tmux.conf"'

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g status-position top
set -g status-style "bg=#13091f,fg=#eaddf5"
set -g message-style "bg=#542476,fg=#fff7ff"
set -g pane-border-style "fg=#3d2155"
set -g pane-active-border-style "fg=#dca7ff"
set -g status-left "#[fg=#dca7ff,bold] 󰆍 #S #[default]"
set -g status-right "#[fg=#9fe8ff]#(whoami)@#H #[fg=#f4a8e0]%a %d %b %H:%M "
set -g status-left-length 32
set -g status-right-length 60
setw -g window-status-format " #[fg=#8e7ba4]#I:#W "
setw -g window-status-current-format "#[bg=#542476,fg=#fff7ff,bold] #I:#W #[default]"
set -g clock-mode-colour "#dca7ff"
set -g mode-style "bg=#86245e,fg=#fff7ff"

# Forward the active pane title to Sway and the workspace decoration.
set -g set-titles on
set -g set-titles-string "#{pane_title}"
