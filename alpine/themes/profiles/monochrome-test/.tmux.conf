# Keep personal controls independent of theme colors and plugin managers.
source-file "$HOME/.config/tmux/oldbook.conf"

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g status-position top
set -g status-style "bg=#000000,fg=#ffffff"
set -g message-style "bg=#ffffff,fg=#000000"
set -g pane-border-style "fg=#ffffff"
set -g pane-active-border-style "fg=#ffffff"
# Powerline chain, built the same way as every other profile's, but this
# theme's own palette (monochrome-test.json) only declares two colors. So the
# chain alternates polarity chip to chip (white-on-black, black-on-white)
# instead of cycling hue, which is the only way to keep every chip boundary
# visible while staying strictly black-and-white -- the whole point of this
# theme. The status bar's own ground (#000000, set above) stands in for
# "transparent" at both ends.
set -g status-left "#[fg=#ffffff,bg=#000000]#[fg=#000000,bg=#ffffff,bold] 󰆍 #S #[fg=#ffffff,bg=#000000]"
set -g status-right "#[fg=#ffffff,bg=#000000]#[fg=#000000,bg=#ffffff] #(whoami)@#H #[fg=#ffffff,bg=#000000]#[fg=#ffffff,bg=#000000] %a %d %b %H:%M #[fg=#000000,bg=#000000]"
set -g status-left-length 32
set -g status-right-length 60
setw -g window-status-format " #[fg=#ffffff]#I:#W "
# The current window keeps its existing highlighted pill, now capped with the
# same separator so it reads as a chip in the same family as the status-line
# segments either side of it.
setw -g window-status-current-format "#[fg=#ffffff,bg=#000000]#[fg=#000000,bg=#ffffff,bold] #I:#W #[fg=#ffffff,bg=#000000]"
set -g clock-mode-colour "#ffffff"
set -g mode-style "bg=#ffffff,fg=#000000"

# Forward the active pane title to Sway and the workspace decoration.
set -g set-titles on
set -g set-titles-string "#{pane_title}"
