[main]
selection-target=both
term=xterm-256color
font=JetBrainsMono Nerd Font:size=9.5
font-bold=JetBrainsMono Nerd Font:style=Bold:size=9.5
font-italic=JetBrainsMono Nerd Font:style=Italic:size=9.5
shell=zsh
pad=6x6 center
resize-delay-ms=40
initial-window-size-chars=106x30
initial-color-theme=dark

# Monochrome Test: warm charcoal, cream text, and the original 16-color palette.
[colors-dark]
alpha=0.78
alpha-mode=all
foreground=ffffff
background=000000
selection-foreground=ffffff
selection-background=ffffff
regular0=000000
regular1=ffffff
regular2=ffffff
regular3=ffffff
regular4=ffffff
regular5=ffffff
regular6=ffffff
regular7=ffffff
bright0=ffffff
bright1=ffffff
bright2=ffffff
bright3=ffffff
bright4=ffffff
bright5=ffffff
bright6=ffffff
bright7=ffffff
cursor=000000 ffffff
urls=ffffff
jump-labels=000000 ffffff
scrollback-indicator=000000 ffffff
search-box-no-match=000000 ffffff
search-box-match=000000 ffffff

[csd]
preferred=server
# Matching fallback when another Wayland compositor supplies no decorations.
size=18
font=Inter:size=9
color=ff000000
border-width=0
border-color=ffffffff
button-color=ffffffff
button-minimize-color=ffffffff
button-maximize-color=ffffffff
button-close-color=ffffffff
