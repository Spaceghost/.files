# Monochrome Test window chrome; keep session commands and shortcuts in sway/config.
# Tiled windows keep their clean edges; floating, stacked and tabbed views get titles.
seat * xcursor_theme Oldbook-Ghost 24
font pango:Inter 9.5
default_border pixel 0
default_floating_border normal 0
title_align left
titlebar_padding 18 7
titlebar_border_thickness 0

# Class                border  title bg text    indicator child border
client.focused          #000000 #000000 #ffffff #ffffff #000000
client.focused_inactive #000000 #000000 #ffffff #000000 #000000
client.unfocused        #000000 #000000 #ffffff #000000 #000000
client.urgent           #000000 #000000 #ffffff #000000 #000000
client.placeholder      #000000 #000000 #ffffff #000000 #000000

gaps inner 6
gaps outer 7
