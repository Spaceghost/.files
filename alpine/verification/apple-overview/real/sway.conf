xwayland disable
output HEADLESS-1 mode 900x600
output * bg #160d22 solid_color
seat seat0 fallback true
input * xkb_layout us
input * repeat_delay 200
input * repeat_rate 30
focus_follows_mouse no
# Apple Mission Control (F3) and Launchpad (F4) keycaps. hid_apple maps
# these to LaunchA/B in automatic mode; Fn+F3/F4 remain application keys.
bindsym --no-repeat XF86LaunchA exec ~/.local/bin/oldbook-carousel show
bindsym --no-repeat XF86LaunchB exec ~/.local/bin/oldbook-menu

# Extend the switcher's existing mode: press Mission Control again to leave,
# or Launchpad to leave the overview and choose an application.
mode "window-switcher" {
    bindsym --no-repeat XF86LaunchA mode "default"
    bindsym --no-repeat XF86LaunchB mode "default", exec ~/.local/bin/oldbook-menu
}
# One recent-use list across every workspace. Hold the initiating modifier,
# tap Tab to browse (Shift reverses), then release to select. Escape cancels.
bindsym Mod4+Tab exec ~/.local/bin/oldbook-carousel next --modifier super
bindsym Mod4+Shift+Tab exec ~/.local/bin/oldbook-carousel previous --modifier super
bindsym Mod1+Tab exec ~/.local/bin/oldbook-carousel next --modifier alt
bindsym Mod1+Shift+Tab exec ~/.local/bin/oldbook-carousel previous --modifier alt

# The mapped carousel receives its own ordered key stream. Escape also
# restores normal bindings if the helper exits unexpectedly.
mode "window-switcher" {
    bindsym Escape mode "default"
    bindsym Mod4+Escape mode "default"
    bindsym Mod1+Escape mode "default"
}
