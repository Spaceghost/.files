add_newline = false
format = "$username$hostname$directory${custom.fossil}$git_branch$git_status$cmd_duration$line_break$character"

[username]
show_always = true
style_user = "bold #B7A83D"
style_root = "bold #d3856f"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "#83d0ac"
format = "[@$hostname]($style) "

[directory]
style = "bold #E4D8B8"
truncation_length = 4
truncate_to_repo = false
read_only = " 󰌾"

[git_branch]
symbol = "󰘬 "
style = "#b981bf"

[git_status]
style = "#d3a26f"

[cmd_duration]
min_time = 500
format = " [󱎫 $duration]($style)"
style = "#83afbf"

[character]
success_symbol = "[❯](bold #97d06f)"
error_symbol = "[❯](bold #d3856f)"

[custom.fossil]
command = "fossil branch current"
when = "fossil info >/dev/null 2>&1"
format = " [󰜘 $output]($style)"
style = "bold #B7A83D"
shell = ["sh"]
