[main]
selection-target=both
term=xterm-256color
font=JetBrainsMono Nerd Font:size=9.5
font-bold=JetBrainsMono Nerd Font:style=Bold:size=9.5
font-italic=JetBrainsMono Nerd Font:style=Italic:size=9.5
shell=zsh
pad=6x6 center
resize-delay-ms=40
initial-window-size-chars=106x30
initial-color-theme=dark

# Gruvbox Dark: warm charcoal, cream text, and the original 16-color palette.
[colors-dark]
alpha=0.94
alpha-mode=all
foreground=E4D8B8
background=111A22
selection-foreground=e9e0c6
selection-background=3f4443
regular0=111A22
regular1=d3856f
regular2=97d06f
regular3=97d06f
regular4=83afbf
regular5=908c7c
regular6=908c7c
regular7=908c7c
bright0=908c7c
bright1=d3856f
bright2=97d06f
bright3=B7A83D
bright4=83afbf
bright5=b981bf
bright6=83d0ac
bright7=E4D8B8
cursor=111A22 B7A83D
urls=83afbf
jump-labels=111A22 B7A83D
scrollback-indicator=111A22 83afbf
search-box-no-match=111A22 d3856f
search-box-match=111A22 97d06f

[csd]
preferred=server
# Matching fallback when another Wayland compositor supplies no decorations.
size=18
font=Inter:size=9
color=ff111A22
border-width=0
border-color=ff3f4443
button-color=ffE4D8B8
button-minimize-color=ff83afbf
button-maximize-color=ff97d06f
button-close-color=ffd3856f
