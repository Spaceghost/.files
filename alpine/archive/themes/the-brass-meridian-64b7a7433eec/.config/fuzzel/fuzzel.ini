# Geometry is shared by all desktop menus. oldbook-fuzzel supplies active theme colors.
[main]
font=JetBrainsMono Nerd Font:size=13
terminal=foot -e
prompt="Applications ❯ "
layer=overlay
lines=10
width=50
horizontal-pad=22
vertical-pad=20
inner-pad=14
line-height=28
image-size-ratio=0.55
icons-enabled=yes
fields=name,generic,comment,categories,filename,keywords
show-actions=yes

[colors]
background=111A22ff
text=E4D8B8ff
match=B7A83Dff
selection=3f4443ff
selection-text=e9e0c6ff
selection-match=d3a26fff
border=97d06fff

[border]
width=1
radius=2
