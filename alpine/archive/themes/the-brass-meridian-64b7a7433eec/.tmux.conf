# Keep personal controls independent of theme colors and plugin managers.
source-file "$HOME/.config/tmux/oldbook.conf"

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g status-position top
set -g status-style "bg=#0d1319,fg=#E4D8B8"
set -g message-style "bg=#3f4443,fg=#e9e0c6"
set -g pane-border-style "fg=#3f4443"
set -g pane-active-border-style "fg=#B7A83D"
set -g status-left "#[fg=#B7A83D,bold] 󰆍 #S #[default]"
set -g status-right "#[fg=#83d0ac]#(whoami)@#H #[fg=#908c7c]%a %d %b %H:%M "
set -g status-left-length 32
set -g status-right-length 60
setw -g window-status-format " #[fg=#908c7c]#I:#W "
setw -g window-status-current-format "#[bg=#3f4443,fg=#e9e0c6,bold] #I:#W #[default]"
set -g clock-mode-colour "#B7A83D"
set -g mode-style "bg=#3f4443,fg=#e9e0c6"

# Select the pane under the pointer without clicking.
set -g mouse on
set -g focus-follows-mouse on

# Forward the active pane title to Sway and the workspace decoration.
set -g set-titles on
set -g set-titles-string "#{pane_title}"
