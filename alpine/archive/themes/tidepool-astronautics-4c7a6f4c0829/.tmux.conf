# Keep personal controls independent of theme colors and plugin managers.
source-file "$HOME/.config/tmux/oldbook.conf"

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g status-position top
set -g status-style "bg=#0d1014,fg=#E7E1D5"
set -g message-style "bg=#404344,fg=#ece7dd"
set -g pane-border-style "fg=#404344"
set -g pane-active-border-style "fg=#D8755B"
set -g status-left "#[fg=#D8755B,bold] 󰆍 #S #[default]"
set -g status-right "#[fg=#88c8b1]#(whoami)@#H #[fg=#91908b]%a %d %b %H:%M "
set -g status-left-length 32
set -g status-right-length 60
setw -g window-status-format " #[fg=#91908b]#I:#W "
setw -g window-status-current-format "#[bg=#404344,fg=#ece7dd,bold] #I:#W #[default]"
set -g clock-mode-colour "#D8755B"
set -g mode-style "bg=#404344,fg=#ece7dd"

# Select the pane under the pointer without clicking.
set -g mouse on
set -g focus-follows-mouse on

# Forward the active pane title to Sway and the workspace decoration.
set -g set-titles on
set -g set-titles-string "#{pane_title}"
