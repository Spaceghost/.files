add_newline = false
format = "$username$hostname$directory${custom.fossil}$git_branch$git_status$cmd_duration$line_break$character"

[username]
show_always = true
style_user = "bold #D8755B"
style_root = "bold #d87d74"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "#88c8b1"
format = "[@$hostname]($style) "

[directory]
style = "bold #E7E1D5"
truncation_length = 4
truncate_to_repo = false
read_only = " 󰌾"

[git_branch]
symbol = "󰘬 "
style = "#be78c4"

[git_status]
style = "#d89a74"

[cmd_duration]
min_time = 500
format = " [󱎫 $duration]($style)"
style = "#88a7c4"

[character]
success_symbol = "[❯](bold #9cc874)"
error_symbol = "[❯](bold #d87d74)"

[custom.fossil]
command = "fossil branch current"
when = "fossil info >/dev/null 2>&1"
format = " [󰜘 $output]($style)"
style = "bold #D8755B"
shell = ["sh"]
