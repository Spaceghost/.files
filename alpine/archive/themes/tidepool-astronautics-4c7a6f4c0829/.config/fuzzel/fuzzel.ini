# Geometry is shared by all desktop menus. oldbook-fuzzel supplies active theme colors.
[main]
font=Inter:size=13
terminal=foot -e
prompt="Applications ❯ "
layer=overlay
lines=10
width=50
horizontal-pad=22
vertical-pad=20
inner-pad=14
line-height=28
image-size-ratio=0.55
icons-enabled=yes
fields=name,generic,comment,categories,filename,keywords
show-actions=yes

[colors]
background=11161Bff
text=E7E1D5ff
match=D8755Bff
selection=404344ff
selection-text=ece7ddff
selection-match=d89a74ff
border=9cc874ff

[border]
width=1
radius=16
