[main]
selection-target=both
term=xterm-256color
font=JetBrainsMono Nerd Font:size=9.5
font-bold=JetBrainsMono Nerd Font:style=Bold:size=9.5
font-italic=JetBrainsMono Nerd Font:style=Italic:size=9.5
shell=zsh
pad=6x6 center
resize-delay-ms=40
initial-window-size-chars=106x30
initial-color-theme=dark

# Gruvbox Dark: warm charcoal, cream text, and the original 16-color palette.
[colors-dark]
alpha=0.82
alpha-mode=all
foreground=E7E1D5
background=11161B
selection-foreground=ece7dd
selection-background=404344
regular0=11161B
regular1=d87d74
regular2=9cc874
regular3=9cc874
regular4=88a7c4
regular5=91908b
regular6=91908b
regular7=91908b
bright0=91908b
bright1=d87d74
bright2=9cc874
bright3=D8755B
bright4=88a7c4
bright5=be78c4
bright6=88c8b1
bright7=E7E1D5
cursor=11161B D8755B
urls=88a7c4
jump-labels=11161B D8755B
scrollback-indicator=11161B 88a7c4
search-box-no-match=11161B d87d74
search-box-match=11161B 9cc874

[csd]
preferred=server
# Matching fallback when another Wayland compositor supplies no decorations.
size=18
font=Inter:size=9
color=ff11161B
border-width=0
border-color=ff404344
button-color=ffE7E1D5
button-minimize-color=ff88a7c4
button-maximize-color=ff9cc874
button-close-color=ffd87d74
