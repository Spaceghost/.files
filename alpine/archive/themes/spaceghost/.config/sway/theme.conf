# Spaceghost window chrome; session commands stay in sway/config.
seat * xcursor_theme simp1e-cursors-rose-pine 24
font pango:JetBrainsMono Nerd Font 9.5
default_border pixel 2
default_floating_border normal 2
title_align center
titlebar_padding 8 1
titlebar_border_thickness 0

# Purple glass: narrow borders make the high-density display feel intentional.
client.focused          #dca7ff #261631 #dca7ff #dca7ff #13091f
client.focused_inactive #261631 #13091f #eaddf5 #261631 #13091f
client.unfocused        #13091f #13091f #816b91 #13091f #13091f
client.urgent           #ff5cbb #57153e #fff7ff #ff5cbb #ff5cbb
client.placeholder      #241237 #170b26 #bca9cf #241237 #241237
