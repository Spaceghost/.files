add_newline = false
format = "$username$hostname$directory${custom.fossil}$git_branch$git_status$cmd_duration$line_break$character"

[username]
show_always = true
style_user = "bold #f6c4ff"
style_root = "bold #ff82c8"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "#a5edff"
format = "[@$hostname]($style) "

[directory]
style = "bold #ddd0ff"
truncation_length = 4
truncate_to_repo = false
read_only = " 󰌾"

[git_branch]
symbol = "󰘬 "
style = "#f4a8e0"

[git_status]
style = "#ffcf91"

[cmd_duration]
min_time = 500
format = " [󱎫 $duration]($style)"
style = "#9fe8ff"

[character]
success_symbol = "[❯](bold #dca7ff)"
error_symbol = "[❯](bold #ff77be)"

[custom.fossil]
command = "fossil branch current"
when = "fossil info >/dev/null 2>&1"
format = " [󰜘 $output]($style)"
style = "bold #b59dff"
shell = ["sh"]
