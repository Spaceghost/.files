[main]
selection-target=both
term=xterm-256color
font=JetBrainsMono Nerd Font:size=9.5
font-bold=JetBrainsMono Nerd Font:style=Bold:size=9.5
font-italic=JetBrainsMono Nerd Font:style=Italic:size=9.5
shell=zsh
pad=5x5 center
resize-delay-ms=40
initial-window-size-chars=106x30
initial-color-theme=dark

# Gruvbox Dark: warm charcoal, cream text, and the original 16-color palette.
[colors-dark]
alpha=0.95
alpha-mode=all
foreground=E7DFC9
background=101827
selection-foreground=ece5d4
selection-background=3f444b
regular0=101827
regular1=d3766f
regular2=97c16f
regular3=97c16f
regular4=83a0bf
regular5=918f88
regular6=918f88
regular7=918f88
bright0=918f88
bright1=d3766f
bright2=97c16f
bright3=B84A3A
bright4=83a0bf
bright5=b971bf
bright6=83c1ab
bright7=E7DFC9
cursor=101827 B84A3A
urls=83a0bf
jump-labels=101827 B84A3A
scrollback-indicator=101827 83a0bf
search-box-no-match=101827 d3766f
search-box-match=101827 97c16f

[csd]
preferred=server
# Matching fallback when another Wayland compositor supplies no decorations.
size=18
font=Inter:size=9
color=ff101827
border-width=0
border-color=ff3f444b
button-color=ffE7DFC9
button-minimize-color=ff83a0bf
button-maximize-color=ff97c16f
button-close-color=ffd3766f
