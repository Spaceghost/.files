# Geometry is shared by all desktop menus. oldbook-fuzzel supplies active theme colors.
[main]
font=DejaVu Sans:size=13
terminal=foot -e
prompt="Applications ❯ "
layer=overlay
lines=10
width=46
horizontal-pad=21
vertical-pad=20
inner-pad=14
line-height=28
image-size-ratio=0.55
icons-enabled=yes
fields=name,generic,comment,categories,filename,keywords
show-actions=yes

[colors]
background=101827ff
text=E7DFC9ff
match=B84A3Aff
selection=3f444bff
selection-text=ece5d4ff
selection-match=d3936fff
border=97c16fff

[border]
width=1
radius=3
