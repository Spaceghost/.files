add_newline = false
format = "$username$hostname$directory${custom.fossil}$git_branch$git_status$cmd_duration$line_break$character"

[username]
show_always = true
style_user = "bold #B84A3A"
style_root = "bold #d3766f"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "#83c1ab"
format = "[@$hostname]($style) "

[directory]
style = "bold #E7DFC9"
truncation_length = 4
truncate_to_repo = false
read_only = " 󰌾"

[git_branch]
symbol = "󰘬 "
style = "#b971bf"

[git_status]
style = "#d3936f"

[cmd_duration]
min_time = 500
format = " [󱎫 $duration]($style)"
style = "#83a0bf"

[character]
success_symbol = "[❯](bold #97c16f)"
error_symbol = "[❯](bold #d3766f)"

[custom.fossil]
command = "fossil branch current"
when = "fossil info >/dev/null 2>&1"
format = " [󰜘 $output]($style)"
style = "bold #B84A3A"
shell = ["sh"]
