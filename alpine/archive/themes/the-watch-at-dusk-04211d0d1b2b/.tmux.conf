# Keep personal controls independent of theme colors and plugin managers.
source-file "$HOME/.config/tmux/oldbook.conf"

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g status-position top
set -g status-style "bg=#0c121d,fg=#E7DFC9"
set -g message-style "bg=#3f444b,fg=#ece5d4"
set -g pane-border-style "fg=#3f444b"
set -g pane-active-border-style "fg=#B84A3A"
set -g status-left "#[fg=#B84A3A,bold] 󰆍 #S #[default]"
set -g status-right "#[fg=#83c1ab]#(whoami)@#H #[fg=#918f88]%a %d %b %H:%M "
set -g status-left-length 32
set -g status-right-length 60
setw -g window-status-format " #[fg=#918f88]#I:#W "
setw -g window-status-current-format "#[bg=#3f444b,fg=#ece5d4,bold] #I:#W #[default]"
set -g clock-mode-colour "#B84A3A"
set -g mode-style "bg=#3f444b,fg=#ece5d4"

# Select the pane under the pointer without clicking.
set -g mouse on
set -g focus-follows-mouse on

# Forward the active pane title to Sway and the workspace decoration.
set -g set-titles on
set -g set-titles-string "#{pane_title}"
