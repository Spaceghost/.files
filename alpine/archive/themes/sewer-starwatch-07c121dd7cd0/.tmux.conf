# Keep personal controls independent of theme colors and plugin managers.
source-file "$HOME/.config/tmux/oldbook.conf"

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g status-position top
set -g status-style "bg=#111a15,fg=#D8C9A5"
set -g message-style "bg=#41483b,fg=#e0d4b7"
set -g pane-border-style "fg=#41483b"
set -g pane-active-border-style "fg=#B85C4A"
set -g status-left "#[fg=#B85C4A,bold] 󰆍 #S #[default]"
set -g status-right "#[fg=#83c4ae]#(whoami)@#H #[fg=#8b876f]%a %d %b %H:%M "
set -g status-left-length 32
set -g status-right-length 60
setw -g window-status-format " #[fg=#8b876f]#I:#W "
setw -g window-status-current-format "#[bg=#41483b,fg=#e0d4b7,bold] #I:#W #[default]"
set -g clock-mode-colour "#B85C4A"
set -g mode-style "bg=#41483b,fg=#e0d4b7"

# Select the pane under the pointer without clicking.
set -g mouse on
set -g focus-follows-mouse on

# Forward the active pane title to Sway and the workspace decoration.
set -g set-titles on
set -g set-titles-string "#{pane_title}"
