# Geometry is shared by all desktop menus. oldbook-fuzzel supplies active theme colors.
[main]
font=DejaVu Sans:size=13
terminal=foot -e
prompt="Applications ❯ "
layer=overlay
lines=10
width=44
horizontal-pad=20
vertical-pad=20
inner-pad=14
line-height=28
image-size-ratio=0.55
icons-enabled=yes
fields=name,generic,comment,categories,filename,keywords
show-actions=yes

[colors]
background=17231Dff
text=D8C9A5ff
match=B85C4Aff
selection=41483bff
selection-text=e0d4b7ff
selection-match=d39671ff
border=97c471ff

[border]
width=1
radius=3
