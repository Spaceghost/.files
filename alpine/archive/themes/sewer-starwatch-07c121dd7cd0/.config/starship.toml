add_newline = false
format = "$username$hostname$directory${custom.fossil}$git_branch$git_status$cmd_duration$line_break$character"

[username]
show_always = true
style_user = "bold #B85C4A"
style_root = "bold #d37971"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "#83c4ae"
format = "[@$hostname]($style) "

[directory]
style = "bold #D8C9A5"
truncation_length = 4
truncate_to_repo = false
read_only = " 󰌾"

[git_branch]
symbol = "󰘬 "
style = "#b974c1"

[git_status]
style = "#d39671"

[cmd_duration]
min_time = 500
format = " [󱎫 $duration]($style)"
style = "#83a3c1"

[character]
success_symbol = "[❯](bold #97c471)"
error_symbol = "[❯](bold #d37971)"

[custom.fossil]
command = "fossil branch current"
when = "fossil info >/dev/null 2>&1"
format = " [󰜘 $output]($style)"
style = "bold #B85C4A"
shell = ["sh"]
