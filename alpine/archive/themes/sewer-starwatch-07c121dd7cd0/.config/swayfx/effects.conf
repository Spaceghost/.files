# SwayFX 0.6 only. Include after the shared Sway configuration.
# Warm charcoal glass; compact corners keep floating titlebars proportional.
corner_radius 3
smart_corner_radius enable
blur enable
blur_xray disable
blur_passes 2
blur_radius 2
blur_noise 0.018
blur_brightness 0.95
blur_contrast 1.03
blur_saturation 1.00
shadows enable
shadows_on_csd enable
shadow_blur_radius 24
shadow_color #111a15c0
shadow_inactive_color #111a1580
shadow_offset 0 6
default_dim_inactive 0.03
dim_inactive_colors.unfocused #17231Dff
titlebar_separator disable
animation_duration_ms 140

layer_effects "waybar" {
    blur enable
    blur_xray enable
    blur_ignore_transparent enable
    shadows enable
    corner_radius 0
}
layer_effects "swaync-control-center" {
    # The layer includes empty space; style only the actual cards in GTK CSS.
    blur disable
    blur_xray disable
    shadows disable
    corner_radius 0
}
layer_effects "swaync-notification-window" {
    # The layer includes empty space; style only the actual cards in GTK CSS.
    blur disable
    blur_xray disable
    shadows disable
    corner_radius 0
}
layer_effects "launcher" {
    blur enable
    blur_xray enable
    shadows enable
    corner_radius 12
}

# GTK changes the strip corners for fullscreen and floating windows.
layer_effects "oldbook-decoration" {
    corner_radius 0
}
