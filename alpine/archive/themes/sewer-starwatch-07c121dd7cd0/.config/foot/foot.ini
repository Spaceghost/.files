[main]
selection-target=both
term=xterm-256color
font=JetBrainsMono Nerd Font:size=9.5
font-bold=JetBrainsMono Nerd Font:style=Bold:size=9.5
font-italic=JetBrainsMono Nerd Font:style=Italic:size=9.5
shell=zsh
pad=4x4 center
resize-delay-ms=40
initial-window-size-chars=106x30
initial-color-theme=dark

# Gruvbox Dark: warm charcoal, cream text, and the original 16-color palette.
[colors-dark]
alpha=0.9
alpha-mode=all
foreground=D8C9A5
background=17231D
selection-foreground=e0d4b7
selection-background=41483b
regular0=17231D
regular1=d37971
regular2=97c471
regular3=97c471
regular4=83a3c1
regular5=8b876f
regular6=8b876f
regular7=8b876f
bright0=8b876f
bright1=d37971
bright2=97c471
bright3=B85C4A
bright4=83a3c1
bright5=b974c1
bright6=83c4ae
bright7=D8C9A5
cursor=17231D B85C4A
urls=83a3c1
jump-labels=17231D B85C4A
scrollback-indicator=17231D 83a3c1
search-box-no-match=17231D d37971
search-box-match=17231D 97c471

[csd]
preferred=server
# Matching fallback when another Wayland compositor supplies no decorations.
size=18
font=Inter:size=9
color=ff17231D
border-width=0
border-color=ff41483b
button-color=ffD8C9A5
button-minimize-color=ff83a3c1
button-maximize-color=ff97c471
button-close-color=ffd37971
