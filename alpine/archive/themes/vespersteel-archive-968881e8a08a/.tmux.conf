# Keep personal controls independent of theme colors and plugin managers.
source-file "$HOME/.config/tmux/oldbook.conf"

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g status-position top
set -g status-style "bg=#111019,fg=#E8DFC9"
set -g message-style "bg=#454147,fg=#ede5d4"
set -g pane-border-style "fg=#454147"
set -g pane-active-border-style "fg=#B78A42"
set -g status-left "#[fg=#B78A42,bold] 󰆍 #S #[default]"
set -g status-right "#[fg=#83ccad]#(whoami)@#H #[fg=#948e86]%a %d %b %H:%M "
set -g status-left-length 32
set -g status-right-length 60
setw -g window-status-format " #[fg=#948e86]#I:#W "
setw -g window-status-current-format "#[bg=#454147,fg=#ede5d4,bold] #I:#W #[default]"
set -g clock-mode-colour "#B78A42"
set -g mode-style "bg=#454147,fg=#ede5d4"

# Select the pane under the pointer without clicking.
set -g mouse on
set -g focus-follows-mouse on

# Forward the active pane title to Sway and the workspace decoration.
set -g set-titles on
set -g set-titles-string "#{pane_title}"
