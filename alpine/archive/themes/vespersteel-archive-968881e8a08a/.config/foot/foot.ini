[main]
selection-target=both
term=xterm-256color
font=JetBrainsMono Nerd Font:size=9.5
font-bold=JetBrainsMono Nerd Font:style=Bold:size=9.5
font-italic=JetBrainsMono Nerd Font:style=Italic:size=9.5
shell=zsh
pad=10x10 center
resize-delay-ms=40
initial-window-size-chars=106x30
initial-color-theme=dark

# Gruvbox Dark: warm charcoal, cream text, and the original 16-color palette.
[colors-dark]
alpha=0.91
alpha-mode=all
foreground=E8DFC9
background=171522
selection-foreground=ede5d4
selection-background=454147
regular0=171522
regular1=d38070
regular2=97cc70
regular3=97cc70
regular4=83aac0
regular5=948e86
regular6=948e86
regular7=948e86
bright0=948e86
bright1=d38070
bright2=97cc70
bright3=B78A42
bright4=83aac0
bright5=b97cc0
bright6=83ccad
bright7=E8DFC9
cursor=171522 B78A42
urls=83aac0
jump-labels=171522 B78A42
scrollback-indicator=171522 83aac0
search-box-no-match=171522 d38070
search-box-match=171522 97cc70

[csd]
preferred=server
# Matching fallback when another Wayland compositor supplies no decorations.
size=18
font=Inter:size=9
color=ff171522
border-width=0
border-color=ff454147
button-color=ffE8DFC9
button-minimize-color=ff83aac0
button-maximize-color=ff97cc70
button-close-color=ffd38070
