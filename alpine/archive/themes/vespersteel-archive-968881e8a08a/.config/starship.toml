add_newline = false
format = "$username$hostname$directory${custom.fossil}$git_branch$git_status$cmd_duration$line_break$character"

[username]
show_always = true
style_user = "bold #B78A42"
style_root = "bold #d38070"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "#83ccad"
format = "[@$hostname]($style) "

[directory]
style = "bold #E8DFC9"
truncation_length = 4
truncate_to_repo = false
read_only = " 󰌾"

[git_branch]
symbol = "󰘬 "
style = "#b97cc0"

[git_status]
style = "#d39d70"

[cmd_duration]
min_time = 500
format = " [󱎫 $duration]($style)"
style = "#83aac0"

[character]
success_symbol = "[❯](bold #97cc70)"
error_symbol = "[❯](bold #d38070)"

[custom.fossil]
command = "fossil branch current"
when = "fossil info >/dev/null 2>&1"
format = " [󰜘 $output]($style)"
style = "bold #B78A42"
shell = ["sh"]
