# Geometry is shared by all desktop menus. oldbook-fuzzel supplies active theme colors.
[main]
font=DejaVu Serif:size=13
terminal=foot -e
prompt="Applications ❯ "
layer=overlay
lines=10
width=46
horizontal-pad=26
vertical-pad=20
inner-pad=14
line-height=28
image-size-ratio=0.55
icons-enabled=yes
fields=name,generic,comment,categories,filename,keywords
show-actions=yes

[colors]
background=171522ff
text=E8DFC9ff
match=B78A42ff
selection=454147ff
selection-text=ede5d4ff
selection-match=d39d70ff
border=97cc70ff

[border]
width=1
radius=6
