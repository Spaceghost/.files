# Gruvbox Dark window chrome; keep session commands and shortcuts in sway/config.
# Tiled windows keep their clean edges; floating, stacked and tabbed views get titles.
seat * xcursor_theme simp1e-cursors-gruvbox-dark 24
font pango:DejaVu Serif 9.5
default_border pixel 0
default_floating_border normal 0
title_align center
titlebar_padding 8 1
titlebar_border_thickness 0

# Class                border  title bg text    indicator child border
client.focused          #2c2933 #2c2933 #B78A42 #B78A42 #171522
client.focused_inactive #171522 #171522 #b97cc0 #171522 #171522
client.unfocused        #111019 #111019 #948e86 #111019 #111019
client.urgent           #171522 #171522 #d38070 #171522 #171522
client.placeholder      #171522 #171522 #b97cc0 #171522 #171522

gaps inner 10
gaps outer 11
