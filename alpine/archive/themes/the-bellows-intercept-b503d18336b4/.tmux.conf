# Keep personal controls independent of theme colors and plugin managers.
source-file "$HOME/.config/tmux/oldbook.conf"

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g status-position top
set -g status-style "bg=#0d1215,fg=#E9E0C9"
set -g message-style "bg=#414542,fg=#ede6d4"
set -g pane-border-style "fg=#414542"
set -g pane-active-border-style "fg=#C86B4A"
set -g status-left "#[fg=#C86B4A,bold] 󰆍 #S #[default]"
set -g status-right "#[fg=#86c7ae]#(whoami)@#H #[fg=#939084]%a %d %b %H:%M "
set -g status-left-length 32
set -g status-right-length 60
setw -g window-status-format " #[fg=#939084]#I:#W "
setw -g window-status-current-format "#[bg=#414542,fg=#ede6d4,bold] #I:#W #[default]"
set -g clock-mode-colour "#C86B4A"
set -g mode-style "bg=#414542,fg=#ede6d4"

# Select the pane under the pointer without clicking.
set -g mouse on
set -g focus-follows-mouse on

# Forward the active pane title to Sway and the workspace decoration.
set -g set-titles on
set -g set-titles-string "#{pane_title}"
