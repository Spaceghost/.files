# Geometry is shared by all desktop menus. oldbook-fuzzel supplies active theme colors.
[main]
font=JetBrainsMono Nerd Font:size=13
terminal=foot -e
prompt="Applications ❯ "
layer=overlay
lines=10
width=58
horizontal-pad=26
vertical-pad=20
inner-pad=14
line-height=28
image-size-ratio=0.55
icons-enabled=yes
fields=name,generic,comment,categories,filename,keywords
show-actions=yes

[colors]
background=11191Cff
text=E9E0C9ff
match=C86B4Aff
selection=414542ff
selection-text=ede6d4ff
selection-match=d59871ff
border=9ac771ff

[border]
width=1
radius=6
