[main]
selection-target=both
term=xterm-256color
font=JetBrainsMono Nerd Font:size=9.5
font-bold=JetBrainsMono Nerd Font:style=Bold:size=9.5
font-italic=JetBrainsMono Nerd Font:style=Italic:size=9.5
shell=zsh
pad=10x10 center
resize-delay-ms=40
initial-window-size-chars=106x30
initial-color-theme=dark

# Gruvbox Dark: warm charcoal, cream text, and the original 16-color palette.
[colors-dark]
alpha=0.88
alpha-mode=all
foreground=E9E0C9
background=11191C
selection-foreground=ede6d4
selection-background=414542
regular0=11191C
regular1=d57b71
regular2=9ac771
regular3=9ac771
regular4=86a5c1
regular5=939084
regular6=939084
regular7=939084
bright0=939084
bright1=d57b71
bright2=9ac771
bright3=C86B4A
bright4=86a5c1
bright5=bb77c1
bright6=86c7ae
bright7=E9E0C9
cursor=11191C C86B4A
urls=86a5c1
jump-labels=11191C C86B4A
scrollback-indicator=11191C 86a5c1
search-box-no-match=11191C d57b71
search-box-match=11191C 9ac771

[csd]
preferred=server
# Matching fallback when another Wayland compositor supplies no decorations.
size=18
font=Inter:size=9
color=ff11191C
border-width=0
border-color=ff414542
button-color=ffE9E0C9
button-minimize-color=ff86a5c1
button-maximize-color=ff9ac771
button-close-color=ffd57b71
