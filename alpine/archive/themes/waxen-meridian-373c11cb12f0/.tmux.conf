# Keep personal controls independent of theme colors and plugin managers.
source-file "$HOME/.config/tmux/oldbook.conf"

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g status-position top
set -g status-style "bg=#111415,fg=#D9E1D5"
set -g message-style "bg=#424745,fg=#e1e7dd"
set -g pane-border-style "fg=#424745"
set -g pane-active-border-style "fg=#D47A52"
set -g status-left "#[fg=#D47A52,bold] 󰆍 #S #[default]"
set -g status-right "#[fg=#88c9af]#(whoami)@#H #[fg=#8b928b]%a %d %b %H:%M "
set -g status-left-length 32
set -g status-right-length 60
setw -g window-status-format " #[fg=#8b928b]#I:#W "
setw -g window-status-current-format "#[bg=#424745,fg=#e1e7dd,bold] #I:#W #[default]"
set -g clock-mode-colour "#D47A52"
set -g mode-style "bg=#424745,fg=#e1e7dd"

# Select the pane under the pointer without clicking.
set -g mouse on
set -g focus-follows-mouse on

# Forward the active pane title to Sway and the workspace decoration.
set -g set-titles on
set -g set-titles-string "#{pane_title}"
