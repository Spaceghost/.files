# Geometry is shared by all desktop menus. oldbook-fuzzel supplies active theme colors.
[main]
font=JetBrainsMono Nerd Font:size=13
terminal=foot -e
prompt="Applications ❯ "
layer=overlay
lines=10
width=54
horizontal-pad=26
vertical-pad=20
inner-pad=14
line-height=28
image-size-ratio=0.55
icons-enabled=yes
fields=name,generic,comment,categories,filename,keywords
show-actions=yes

[colors]
background=171B1Dff
text=D9E1D5ff
match=D47A52ff
selection=424745ff
selection-text=e1e7ddff
selection-match=d79b73ff
border=9cc973ff

[border]
width=1
radius=6
