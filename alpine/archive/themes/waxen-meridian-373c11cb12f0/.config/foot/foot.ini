[main]
selection-target=both
term=xterm-256color
font=JetBrainsMono Nerd Font:size=9.5
font-bold=JetBrainsMono Nerd Font:style=Bold:size=9.5
font-italic=JetBrainsMono Nerd Font:style=Italic:size=9.5
shell=zsh
pad=10x10 center
resize-delay-ms=40
initial-window-size-chars=106x30
initial-color-theme=dark

# Gruvbox Dark: warm charcoal, cream text, and the original 16-color palette.
[colors-dark]
alpha=0.91
alpha-mode=all
foreground=D9E1D5
background=171B1D
selection-foreground=e1e7dd
selection-background=424745
regular0=171B1D
regular1=d77d73
regular2=9cc973
regular3=9cc973
regular4=88a7c3
regular5=8b928b
regular6=8b928b
regular7=8b928b
bright0=8b928b
bright1=d77d73
bright2=9cc973
bright3=D47A52
bright4=88a7c3
bright5=bd79c3
bright6=88c9af
bright7=D9E1D5
cursor=171B1D D47A52
urls=88a7c3
jump-labels=171B1D D47A52
scrollback-indicator=171B1D 88a7c3
search-box-no-match=171B1D d77d73
search-box-match=171B1D 9cc973

[csd]
preferred=server
# Matching fallback when another Wayland compositor supplies no decorations.
size=18
font=Inter:size=9
color=ff171B1D
border-width=0
border-color=ff424745
button-color=ffD9E1D5
button-minimize-color=ff88a7c3
button-maximize-color=ff9cc973
button-close-color=ffd77d73
