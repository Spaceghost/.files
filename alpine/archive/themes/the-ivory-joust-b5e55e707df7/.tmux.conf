# Keep personal controls independent of theme colors and plugin managers.
source-file "$HOME/.config/tmux/oldbook.conf"

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g status-position top
set -g status-style "bg=#11151e,fg=#E8DEC7"
set -g message-style "bg=#45474c,fg=#ede5d2"
set -g pane-border-style "fg=#45474c"
set -g pane-active-border-style "fg=#C86B58"
set -g status-left "#[fg=#C86B58,bold] 󰆍 #S #[default]"
set -g status-right "#[fg=#86c7b0]#(whoami)@#H #[fg=#949188]%a %d %b %H:%M "
set -g status-left-length 32
set -g status-right-length 60
setw -g window-status-format " #[fg=#949188]#I:#W "
setw -g window-status-current-format "#[bg=#45474c,fg=#ede5d2,bold] #I:#W #[default]"
set -g clock-mode-colour "#C86B58"
set -g mode-style "bg=#45474c,fg=#ede5d2"

# Select the pane under the pointer without clicking.
set -g mouse on
set -g focus-follows-mouse on

# Forward the active pane title to Sway and the workspace decoration.
set -g set-titles on
set -g set-titles-string "#{pane_title}"
