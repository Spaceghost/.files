[main]
selection-target=both
term=xterm-256color
font=JetBrainsMono Nerd Font:size=9.5
font-bold=JetBrainsMono Nerd Font:style=Bold:size=9.5
font-italic=JetBrainsMono Nerd Font:style=Italic:size=9.5
shell=zsh
pad=8x8 center
resize-delay-ms=40
initial-window-size-chars=106x30
initial-color-theme=dark

# Gruvbox Dark: warm charcoal, cream text, and the original 16-color palette.
[colors-dark]
alpha=0.9
alpha-mode=all
foreground=E8DEC7
background=171D29
selection-foreground=ede5d2
selection-background=45474c
regular0=171D29
regular1=d57b74
regular2=9ac774
regular3=9ac774
regular4=86a5c4
regular5=949188
regular6=949188
regular7=949188
bright0=949188
bright1=d57b74
bright2=9ac774
bright3=C86B58
bright4=86a5c4
bright5=bb77c4
bright6=86c7b0
bright7=E8DEC7
cursor=171D29 C86B58
urls=86a5c4
jump-labels=171D29 C86B58
scrollback-indicator=171D29 86a5c4
search-box-no-match=171D29 d57b74
search-box-match=171D29 9ac774

[csd]
preferred=server
# Matching fallback when another Wayland compositor supplies no decorations.
size=18
font=Inter:size=9
color=ff171D29
border-width=0
border-color=ff45474c
button-color=ffE8DEC7
button-minimize-color=ff86a5c4
button-maximize-color=ff9ac774
button-close-color=ffd57b74
