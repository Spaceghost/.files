# Geometry is shared by all desktop menus. oldbook-fuzzel supplies active theme colors.
[main]
font=DejaVu Serif:size=13
terminal=foot -e
prompt="Applications ❯ "
layer=overlay
lines=10
width=52
horizontal-pad=24
vertical-pad=20
inner-pad=14
line-height=28
image-size-ratio=0.55
icons-enabled=yes
fields=name,generic,comment,categories,filename,keywords
show-actions=yes

[colors]
background=171D29ff
text=E8DEC7ff
match=C86B58ff
selection=45474cff
selection-text=ede5d2ff
selection-match=d59874ff
border=9ac774ff

[border]
width=1
radius=10
