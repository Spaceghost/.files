# Keep personal controls independent of theme colors and plugin managers.
source-file "$HOME/.config/tmux/oldbook.conf"

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g status-position top
set -g status-style "bg=#100b15,fg=#E9DCC2"
set -g message-style "bg=#443c41,fg=#ede3ce"
set -g pane-border-style "fg=#443c41"
set -g pane-active-border-style "fg=#2FA7A0"
set -g status-left "#[fg=#2FA7A0,bold] 󰆍 #S #[default]"
set -g status-right "#[fg=#6dd0bc]#(whoami)@#H #[fg=#958a80]%a %d %b %H:%M "
set -g status-left-length 32
set -g status-right-length 60
setw -g window-status-format " #[fg=#958a80]#I:#W "
setw -g window-status-current-format "#[bg=#443c41,fg=#ede3ce,bold] #I:#W #[default]"
set -g clock-mode-colour "#2FA7A0"
set -g mode-style "bg=#443c41,fg=#ede3ce"

# Select the pane under the pointer without clicking.
set -g mouse on
set -g focus-follows-mouse on

# Forward the active pane title to Sway and the workspace decoration.
set -g set-titles on
set -g set-titles-string "#{pane_title}"
