# Geometry is shared by all desktop menus. oldbook-fuzzel supplies active theme colors.
[main]
font=DejaVu Serif:size=13
terminal=foot -e
prompt="Applications ❯ "
layer=overlay
lines=10
width=55
horizontal-pad=25
vertical-pad=20
inner-pad=14
line-height=28
image-size-ratio=0.55
icons-enabled=yes
fields=name,generic,comment,categories,filename,keywords
show-actions=yes

[colors]
background=160F1Dff
text=E9DCC2ff
match=2FA7A0ff
selection=443c41ff
selection-text=ede3ceff
selection-match=bda27fff
border=81d07fff

[border]
width=1
radius=7
