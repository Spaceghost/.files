add_newline = false
format = "$username$hostname$directory${custom.fossil}$git_branch$git_status$cmd_duration$line_break$character"

[username]
show_always = true
style_user = "bold #2FA7A0"
style_root = "bold #bd857f"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "#6dd0bc"
format = "[@$hostname]($style) "

[directory]
style = "bold #E9DCC2"
truncation_length = 4
truncate_to_repo = false
read_only = " 󰌾"

[git_branch]
symbol = "󰘬 "
style = "#a380cf"

[git_status]
style = "#bda27f"

[cmd_duration]
min_time = 500
format = " [󱎫 $duration]($style)"
style = "#6dafcf"

[character]
success_symbol = "[❯](bold #81d07f)"
error_symbol = "[❯](bold #bd857f)"

[custom.fossil]
command = "fossil branch current"
when = "fossil info >/dev/null 2>&1"
format = " [󰜘 $output]($style)"
style = "bold #2FA7A0"
shell = ["sh"]
