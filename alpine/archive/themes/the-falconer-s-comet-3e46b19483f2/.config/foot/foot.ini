[main]
selection-target=both
term=xterm-256color
font=JetBrainsMono Nerd Font:size=9.5
font-bold=JetBrainsMono Nerd Font:style=Bold:size=9.5
font-italic=JetBrainsMono Nerd Font:style=Italic:size=9.5
shell=zsh
pad=9x9 center
resize-delay-ms=40
initial-window-size-chars=106x30
initial-color-theme=dark

# Gruvbox Dark: warm charcoal, cream text, and the original 16-color palette.
[colors-dark]
alpha=0.92
alpha-mode=all
foreground=E9DCC2
background=160F1D
selection-foreground=ede3ce
selection-background=443c41
regular0=160F1D
regular1=bd857f
regular2=81d07f
regular3=81d07f
regular4=6dafcf
regular5=958a80
regular6=958a80
regular7=958a80
bright0=958a80
bright1=bd857f
bright2=81d07f
bright3=2FA7A0
bright4=6dafcf
bright5=a380cf
bright6=6dd0bc
bright7=E9DCC2
cursor=160F1D 2FA7A0
urls=6dafcf
jump-labels=160F1D 2FA7A0
scrollback-indicator=160F1D 6dafcf
search-box-no-match=160F1D bd857f
search-box-match=160F1D 81d07f

[csd]
preferred=server
# Matching fallback when another Wayland compositor supplies no decorations.
size=18
font=Inter:size=9
color=ff160F1D
border-width=0
border-color=ff443c41
button-color=ffE9DCC2
button-minimize-color=ff6dafcf
button-maximize-color=ff81d07f
button-close-color=ffbd857f
