# Keep personal controls independent of theme colors and plugin managers.
source-file "$HOME/.config/tmux/oldbook.conf"

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g status-position top
set -g status-style "bg=#0c151b,fg=#E7E1CF"
set -g message-style "bg=#3f474a,fg=#ece7d9"
set -g pane-border-style "fg=#3f474a"
set -g pane-active-border-style "fg=#D5A63A"
set -g status-left "#[fg=#D5A63A,bold] 󰆍 #S #[default]"
set -g status-right "#[fg=#88d0ab]#(whoami)@#H #[fg=#91928b]%a %d %b %H:%M "
set -g status-left-length 32
set -g status-right-length 60
setw -g window-status-format " #[fg=#91928b]#I:#W "
setw -g window-status-current-format "#[bg=#3f474a,fg=#ece7d9,bold] #I:#W #[default]"
set -g clock-mode-colour "#D5A63A"
set -g mode-style "bg=#3f474a,fg=#ece7d9"

# Select the pane under the pointer without clicking.
set -g mouse on
set -g focus-follows-mouse on

# Forward the active pane title to Sway and the workspace decoration.
set -g set-titles on
set -g set-titles-string "#{pane_title}"
