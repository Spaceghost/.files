[main]
selection-target=both
term=xterm-256color
font=JetBrainsMono Nerd Font:size=9.5
font-bold=JetBrainsMono Nerd Font:style=Bold:size=9.5
font-italic=JetBrainsMono Nerd Font:style=Italic:size=9.5
shell=zsh
pad=10x10 center
resize-delay-ms=40
initial-window-size-chars=106x30
initial-color-theme=dark

# Gruvbox Dark: warm charcoal, cream text, and the original 16-color palette.
[colors-dark]
alpha=0.91
alpha-mode=all
foreground=E7E1CF
background=101C24
selection-foreground=ece7d9
selection-background=3f474a
regular0=101C24
regular1=d8846f
regular2=9cd06f
regular3=9cd06f
regular4=88aebf
regular5=91928b
regular6=91928b
regular7=91928b
bright0=91928b
bright1=d8846f
bright2=9cd06f
bright3=D5A63A
bright4=88aebf
bright5=bd80bf
bright6=88d0ab
bright7=E7E1CF
cursor=101C24 D5A63A
urls=88aebf
jump-labels=101C24 D5A63A
scrollback-indicator=101C24 88aebf
search-box-no-match=101C24 d8846f
search-box-match=101C24 9cd06f

[csd]
preferred=server
# Matching fallback when another Wayland compositor supplies no decorations.
size=18
font=Inter:size=9
color=ff101C24
border-width=0
border-color=ff3f474a
button-color=ffE7E1CF
button-minimize-color=ff88aebf
button-maximize-color=ff9cd06f
button-close-color=ffd8846f
