add_newline = false
format = "$username$hostname$directory${custom.fossil}$git_branch$git_status$cmd_duration$line_break$character"

[username]
show_always = true
style_user = "bold #D5A63A"
style_root = "bold #d8846f"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "#88d0ab"
format = "[@$hostname]($style) "

[directory]
style = "bold #E7E1CF"
truncation_length = 4
truncate_to_repo = false
read_only = " 󰌾"

[git_branch]
symbol = "󰘬 "
style = "#bd80bf"

[git_status]
style = "#d8a26f"

[cmd_duration]
min_time = 500
format = " [󱎫 $duration]($style)"
style = "#88aebf"

[character]
success_symbol = "[❯](bold #9cd06f)"
error_symbol = "[❯](bold #d8846f)"

[custom.fossil]
command = "fossil branch current"
when = "fossil info >/dev/null 2>&1"
format = " [󰜘 $output]($style)"
style = "bold #D5A63A"
shell = ["sh"]
