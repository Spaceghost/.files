# Geometry is shared by all desktop menus. oldbook-fuzzel supplies active theme colors.
[main]
font=JetBrainsMono Nerd Font:size=13
terminal=foot -e
prompt="Applications ❯ "
layer=overlay
lines=10
width=56
horizontal-pad=26
vertical-pad=20
inner-pad=14
line-height=28
image-size-ratio=0.55
icons-enabled=yes
fields=name,generic,comment,categories,filename,keywords
show-actions=yes

[colors]
background=101C24ff
text=E7E1CFff
match=D5A63Aff
selection=3f474aff
selection-text=ece7d9ff
selection-match=d8a26fff
border=9cd06fff

[border]
width=1
radius=6
