# Keep personal controls independent of theme colors and plugin managers.
source-file "$HOME/.config/tmux/oldbook.conf"

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g status-position top
set -g status-style "bg=#0c1214,fg=#D8D4BC"
set -g message-style "bg=#3c423e,fg=#e0ddc9"
set -g pane-border-style "fg=#3c423e"
set -g pane-active-border-style "fg=#D46B3F"
set -g status-left "#[fg=#D46B3F,bold] 󰆍 #S #[default]"
set -g status-right "#[fg=#88c7ac]#(whoami)@#H #[fg=#88897c]%a %d %b %H:%M "
set -g status-left-length 32
set -g status-right-length 60
setw -g window-status-format " #[fg=#88897c]#I:#W "
setw -g window-status-current-format "#[bg=#3c423e,fg=#e0ddc9,bold] #I:#W #[default]"
set -g clock-mode-colour "#D46B3F"
set -g mode-style "bg=#3c423e,fg=#e0ddc9"

# Select the pane under the pointer without clicking.
set -g mouse on
set -g focus-follows-mouse on

# Forward the active pane title to Sway and the workspace decoration.
set -g set-titles on
set -g set-titles-string "#{pane_title}"
