[main]
selection-target=both
term=xterm-256color
font=JetBrainsMono Nerd Font:size=9.5
font-bold=JetBrainsMono Nerd Font:style=Bold:size=9.5
font-italic=JetBrainsMono Nerd Font:style=Italic:size=9.5
shell=zsh
pad=10x10 center
resize-delay-ms=40
initial-window-size-chars=106x30
initial-color-theme=dark

# Gruvbox Dark: warm charcoal, cream text, and the original 16-color palette.
[colors-dark]
alpha=0.91
alpha-mode=all
foreground=D8D4BC
background=10191B
selection-foreground=e0ddc9
selection-background=3c423e
regular0=10191B
regular1=d77b70
regular2=9cc770
regular3=9cc770
regular4=88a5c0
regular5=88897c
regular6=88897c
regular7=88897c
bright0=88897c
bright1=d77b70
bright2=9cc770
bright3=D46B3F
bright4=88a5c0
bright5=bd77c0
bright6=88c7ac
bright7=D8D4BC
cursor=10191B D46B3F
urls=88a5c0
jump-labels=10191B D46B3F
scrollback-indicator=10191B 88a5c0
search-box-no-match=10191B d77b70
search-box-match=10191B 9cc770

[csd]
preferred=server
# Matching fallback when another Wayland compositor supplies no decorations.
size=18
font=Inter:size=9
color=ff10191B
border-width=0
border-color=ff3c423e
button-color=ffD8D4BC
button-minimize-color=ff88a5c0
button-maximize-color=ff9cc770
button-close-color=ffd77b70
