add_newline = false
format = "$username$hostname$directory${custom.fossil}$git_branch$git_status$cmd_duration$line_break$character"

[username]
show_always = true
style_user = "bold #D46B3F"
style_root = "bold #d77b70"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "#88c7ac"
format = "[@$hostname]($style) "

[directory]
style = "bold #D8D4BC"
truncation_length = 4
truncate_to_repo = false
read_only = " 󰌾"

[git_branch]
symbol = "󰘬 "
style = "#bd77c0"

[git_status]
style = "#d79870"

[cmd_duration]
min_time = 500
format = " [󱎫 $duration]($style)"
style = "#88a5c0"

[character]
success_symbol = "[❯](bold #9cc770)"
error_symbol = "[❯](bold #d77b70)"

[custom.fossil]
command = "fossil branch current"
when = "fossil info >/dev/null 2>&1"
format = " [󰜘 $output]($style)"
style = "bold #D46B3F"
shell = ["sh"]
