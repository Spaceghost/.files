# Geometry is shared by all desktop menus. oldbook-fuzzel supplies active theme colors.
[main]
font=DejaVu Serif:size=13
terminal=foot -e
prompt="Applications ❯ "
layer=overlay
lines=10
width=54
horizontal-pad=26
vertical-pad=20
inner-pad=14
line-height=28
image-size-ratio=0.55
icons-enabled=yes
fields=name,generic,comment,categories,filename,keywords
show-actions=yes

[colors]
background=10191Bff
text=D8D4BCff
match=D46B3Fff
selection=3c423eff
selection-text=e0ddc9ff
selection-match=d79870ff
border=9cc770ff

[border]
width=1
radius=6
