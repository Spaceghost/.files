add_newline = false
format = "$username$hostname$directory${custom.fossil}$git_branch$git_status$cmd_duration$line_break$character"

[username]
show_always = true
style_user = "bold #C47A3D"
style_root = "bold #d57d6f"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "#85c9ac"
format = "[@$hostname]($style) "

[directory]
style = "bold #E9E0C8"
truncation_length = 4
truncate_to_repo = false
read_only = " 󰌾"

[git_branch]
symbol = "󰘬 "
style = "#bb79bf"

[git_status]
style = "#d59b6f"

[cmd_duration]
min_time = 500
format = " [󱎫 $duration]($style)"
style = "#85a7bf"

[character]
success_symbol = "[❯](bold #99c96f)"
error_symbol = "[❯](bold #d57d6f)"

[custom.fossil]
command = "fossil branch current"
when = "fossil info >/dev/null 2>&1"
format = " [󰜘 $output]($style)"
style = "bold #C47A3D"
shell = ["sh"]
