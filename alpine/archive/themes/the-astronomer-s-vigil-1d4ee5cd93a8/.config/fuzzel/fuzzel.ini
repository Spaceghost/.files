# Geometry is shared by all desktop menus. oldbook-fuzzel supplies active theme colors.
[main]
font=DejaVu Serif:size=13
terminal=foot -e
prompt="Applications ❯ "
layer=overlay
lines=10
width=56
horizontal-pad=26
vertical-pad=20
inner-pad=14
line-height=28
image-size-ratio=0.55
icons-enabled=yes
fields=name,generic,comment,categories,filename,keywords
show-actions=yes

[colors]
background=211B2Eff
text=E9E0C8ff
match=C47A3Dff
selection=4d4650ff
selection-text=ede6d3ff
selection-match=d59b6fff
border=99c96fff

[border]
width=1
radius=4
