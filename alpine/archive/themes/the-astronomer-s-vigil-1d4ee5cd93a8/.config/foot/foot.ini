[main]
selection-target=both
term=xterm-256color
font=JetBrainsMono Nerd Font:size=9.5
font-bold=JetBrainsMono Nerd Font:style=Bold:size=9.5
font-italic=JetBrainsMono Nerd Font:style=Italic:size=9.5
shell=zsh
pad=10x10 center
resize-delay-ms=40
initial-window-size-chars=106x30
initial-color-theme=dark

# Gruvbox Dark: warm charcoal, cream text, and the original 16-color palette.
[colors-dark]
alpha=0.96
alpha-mode=all
foreground=E9E0C8
background=211B2E
selection-foreground=ede6d3
selection-background=4d4650
regular0=211B2E
regular1=d57d6f
regular2=99c96f
regular3=99c96f
regular4=85a7bf
regular5=99918a
regular6=99918a
regular7=99918a
bright0=99918a
bright1=d57d6f
bright2=99c96f
bright3=C47A3D
bright4=85a7bf
bright5=bb79bf
bright6=85c9ac
bright7=E9E0C8
cursor=211B2E C47A3D
urls=85a7bf
jump-labels=211B2E C47A3D
scrollback-indicator=211B2E 85a7bf
search-box-no-match=211B2E d57d6f
search-box-match=211B2E 99c96f

[csd]
preferred=server
# Matching fallback when another Wayland compositor supplies no decorations.
size=18
font=Inter:size=9
color=ff211B2E
border-width=0
border-color=ff4d4650
button-color=ffE9E0C8
button-minimize-color=ff85a7bf
button-maximize-color=ff99c96f
button-close-color=ffd57d6f
