# Keep personal controls independent of theme colors and plugin managers.
source-file "$HOME/.config/tmux/oldbook.conf"

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g status-position top
set -g status-style "bg=#181422,fg=#E9E0C8"
set -g message-style "bg=#4d4650,fg=#ede6d3"
set -g pane-border-style "fg=#4d4650"
set -g pane-active-border-style "fg=#C47A3D"
set -g status-left "#[fg=#C47A3D,bold] 󰆍 #S #[default]"
set -g status-right "#[fg=#85c9ac]#(whoami)@#H #[fg=#99918a]%a %d %b %H:%M "
set -g status-left-length 32
set -g status-right-length 60
setw -g window-status-format " #[fg=#99918a]#I:#W "
setw -g window-status-current-format "#[bg=#4d4650,fg=#ede6d3,bold] #I:#W #[default]"
set -g clock-mode-colour "#C47A3D"
set -g mode-style "bg=#4d4650,fg=#ede6d3"

# Select the pane under the pointer without clicking.
set -g mouse on
set -g focus-follows-mouse on

# Forward the active pane title to Sway and the workspace decoration.
set -g set-titles on
set -g set-titles-string "#{pane_title}"
