# Geometry is shared by all desktop menus. oldbook-fuzzel supplies active theme colors.
[main]
font=DejaVu Serif:size=13
terminal=foot -e
prompt="Applications ❯ "
layer=overlay
lines=10
width=58
horizontal-pad=26
vertical-pad=20
inner-pad=14
line-height=28
image-size-ratio=0.55
icons-enabled=yes
fields=name,generic,comment,categories,filename,keywords
show-actions=yes

[colors]
background=141A24ff
text=E8E1D2ff
match=B86A4Bff
selection=43464aff
selection-text=ede7dbff
selection-match=d39872ff
border=97c672ff

[border]
width=1
radius=6
