[main]
selection-target=both
term=xterm-256color
font=JetBrainsMono Nerd Font:size=9.5
font-bold=JetBrainsMono Nerd Font:style=Bold:size=9.5
font-italic=JetBrainsMono Nerd Font:style=Italic:size=9.5
shell=zsh
pad=10x10 center
resize-delay-ms=40
initial-window-size-chars=106x30
initial-color-theme=dark

# Gruvbox Dark: warm charcoal, cream text, and the original 16-color palette.
[colors-dark]
alpha=0.9
alpha-mode=all
foreground=E8E1D2
background=141A24
selection-foreground=ede7db
selection-background=43464a
regular0=141A24
regular1=d37b72
regular2=97c672
regular3=97c672
regular4=83a5c1
regular5=93918c
regular6=93918c
regular7=93918c
bright0=93918c
bright1=d37b72
bright2=97c672
bright3=B86A4B
bright4=83a5c1
bright5=b977c1
bright6=83c6ae
bright7=E8E1D2
cursor=141A24 B86A4B
urls=83a5c1
jump-labels=141A24 B86A4B
scrollback-indicator=141A24 83a5c1
search-box-no-match=141A24 d37b72
search-box-match=141A24 97c672

[csd]
preferred=server
# Matching fallback when another Wayland compositor supplies no decorations.
size=18
font=Inter:size=9
color=ff141A24
border-width=0
border-color=ff43464a
button-color=ffE8E1D2
button-minimize-color=ff83a5c1
button-maximize-color=ff97c672
button-close-color=ffd37b72
