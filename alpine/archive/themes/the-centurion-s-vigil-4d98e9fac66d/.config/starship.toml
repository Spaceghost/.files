add_newline = false
format = "$username$hostname$directory${custom.fossil}$git_branch$git_status$cmd_duration$line_break$character"

[username]
show_always = true
style_user = "bold #B86A4B"
style_root = "bold #d37b72"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "#83c6ae"
format = "[@$hostname]($style) "

[directory]
style = "bold #E8E1D2"
truncation_length = 4
truncate_to_repo = false
read_only = " 󰌾"

[git_branch]
symbol = "󰘬 "
style = "#b977c1"

[git_status]
style = "#d39872"

[cmd_duration]
min_time = 500
format = " [󱎫 $duration]($style)"
style = "#83a5c1"

[character]
success_symbol = "[❯](bold #97c672)"
error_symbol = "[❯](bold #d37b72)"

[custom.fossil]
command = "fossil branch current"
when = "fossil info >/dev/null 2>&1"
format = " [󰜘 $output]($style)"
style = "bold #B86A4B"
shell = ["sh"]
