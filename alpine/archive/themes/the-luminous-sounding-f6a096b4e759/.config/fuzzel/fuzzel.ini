# Geometry is shared by all desktop menus. oldbook-fuzzel supplies active theme colors.
[main]
font=JetBrainsMono Nerd Font:size=13
terminal=foot -e
prompt="Applications ❯ "
layer=overlay
lines=10
width=48
horizontal-pad=26
vertical-pad=20
inner-pad=14
line-height=28
image-size-ratio=0.55
icons-enabled=yes
fields=name,generic,comment,categories,filename,keywords
show-actions=yes

[colors]
background=081B26ff
text=E8E2D1ff
match=D9654Fff
selection=39474cff
selection-text=ede8daff
selection-match=d89772ff
border=9dc672ff

[border]
width=1
radius=6
