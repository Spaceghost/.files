add_newline = false
format = "$username$hostname$directory${custom.fossil}$git_branch$git_status$cmd_duration$line_break$character"

[username]
show_always = true
style_user = "bold #D9654F"
style_root = "bold #d87a72"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "#88c6af"
format = "[@$hostname]($style) "

[directory]
style = "bold #E8E2D1"
truncation_length = 4
truncate_to_repo = false
read_only = " 󰌾"

[git_branch]
symbol = "󰘬 "
style = "#be76c2"

[git_status]
style = "#d89772"

[cmd_duration]
min_time = 500
format = " [󱎫 $duration]($style)"
style = "#88a4c2"

[character]
success_symbol = "[❯](bold #9dc672)"
error_symbol = "[❯](bold #d87a72)"

[custom.fossil]
command = "fossil branch current"
when = "fossil info >/dev/null 2>&1"
format = " [󰜘 $output]($style)"
style = "bold #D9654F"
shell = ["sh"]
