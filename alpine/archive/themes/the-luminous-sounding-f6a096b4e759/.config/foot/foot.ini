[main]
selection-target=both
term=xterm-256color
font=JetBrainsMono Nerd Font:size=9.5
font-bold=JetBrainsMono Nerd Font:style=Bold:size=9.5
font-italic=JetBrainsMono Nerd Font:style=Italic:size=9.5
shell=zsh
pad=10x10 center
resize-delay-ms=40
initial-window-size-chars=106x30
initial-color-theme=dark

# Gruvbox Dark: warm charcoal, cream text, and the original 16-color palette.
[colors-dark]
alpha=0.88
alpha-mode=all
foreground=E8E2D1
background=081B26
selection-foreground=ede8da
selection-background=39474c
regular0=081B26
regular1=d87a72
regular2=9dc672
regular3=9dc672
regular4=88a4c2
regular5=8e928d
regular6=8e928d
regular7=8e928d
bright0=8e928d
bright1=d87a72
bright2=9dc672
bright3=D9654F
bright4=88a4c2
bright5=be76c2
bright6=88c6af
bright7=E8E2D1
cursor=081B26 D9654F
urls=88a4c2
jump-labels=081B26 D9654F
scrollback-indicator=081B26 88a4c2
search-box-no-match=081B26 d87a72
search-box-match=081B26 9dc672

[csd]
preferred=server
# Matching fallback when another Wayland compositor supplies no decorations.
size=18
font=Inter:size=9
color=ff081B26
border-width=0
border-color=ff39474c
button-color=ffE8E2D1
button-minimize-color=ff88a4c2
button-maximize-color=ff9dc672
button-close-color=ffd87a72
