# Keep personal controls independent of theme colors and plugin managers.
source-file "$HOME/.config/tmux/oldbook.conf"

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g status-position top
set -g status-style "bg=#06141c,fg=#E8E2D1"
set -g message-style "bg=#39474c,fg=#ede8da"
set -g pane-border-style "fg=#39474c"
set -g pane-active-border-style "fg=#D9654F"
set -g status-left "#[fg=#D9654F,bold] 󰆍 #S #[default]"
set -g status-right "#[fg=#88c6af]#(whoami)@#H #[fg=#8e928d]%a %d %b %H:%M "
set -g status-left-length 32
set -g status-right-length 60
setw -g window-status-format " #[fg=#8e928d]#I:#W "
setw -g window-status-current-format "#[bg=#39474c,fg=#ede8da,bold] #I:#W #[default]"
set -g clock-mode-colour "#D9654F"
set -g mode-style "bg=#39474c,fg=#ede8da"

# Select the pane under the pointer without clicking.
set -g mouse on
set -g focus-follows-mouse on

# Forward the active pane title to Sway and the workspace decoration.
set -g set-titles on
set -g set-titles-string "#{pane_title}"
