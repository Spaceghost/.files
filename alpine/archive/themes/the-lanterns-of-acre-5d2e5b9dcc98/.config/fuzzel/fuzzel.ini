# Geometry is shared by all desktop menus. oldbook-fuzzel supplies active theme colors.
[main]
font=DejaVu Serif:size=13
terminal=foot -e
prompt="Applications ❯ "
layer=overlay
lines=10
width=54
horizontal-pad=24
vertical-pad=20
inner-pad=14
line-height=28
image-size-ratio=0.55
icons-enabled=yes
fields=name,generic,comment,categories,filename,keywords
show-actions=yes

[colors]
background=211B35ff
text=D8C9A2ff
match=C56A4Aff
selection=49414dff
selection-text=e0d4b5ff
selection-match=d59871ff
border=99c671ff

[border]
width=1
radius=12
