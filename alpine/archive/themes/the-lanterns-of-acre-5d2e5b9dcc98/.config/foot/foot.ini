[main]
selection-target=both
term=xterm-256color
font=JetBrainsMono Nerd Font:size=9.5
font-bold=JetBrainsMono Nerd Font:style=Bold:size=9.5
font-italic=JetBrainsMono Nerd Font:style=Italic:size=9.5
shell=zsh
pad=8x8 center
resize-delay-ms=40
initial-window-size-chars=106x30
initial-color-theme=dark

# Gruvbox Dark: warm charcoal, cream text, and the original 16-color palette.
[colors-dark]
alpha=0.9
alpha-mode=all
foreground=D8C9A2
background=211B35
selection-foreground=e0d4b5
selection-background=49414d
regular0=211B35
regular1=d57b71
regular2=99c671
regular3=99c671
regular4=85a5c1
regular5=8f8376
regular6=8f8376
regular7=8f8376
bright0=8f8376
bright1=d57b71
bright2=99c671
bright3=C56A4A
bright4=85a5c1
bright5=bb77c1
bright6=85c6ae
bright7=D8C9A2
cursor=211B35 C56A4A
urls=85a5c1
jump-labels=211B35 C56A4A
scrollback-indicator=211B35 85a5c1
search-box-no-match=211B35 d57b71
search-box-match=211B35 99c671

[csd]
preferred=server
# Matching fallback when another Wayland compositor supplies no decorations.
size=18
font=Inter:size=9
color=ff211B35
border-width=0
border-color=ff49414d
button-color=ffD8C9A2
button-minimize-color=ff85a5c1
button-maximize-color=ff99c671
button-close-color=ffd57b71
