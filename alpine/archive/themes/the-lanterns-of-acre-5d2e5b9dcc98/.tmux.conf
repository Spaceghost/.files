# Keep personal controls independent of theme colors and plugin managers.
source-file "$HOME/.config/tmux/oldbook.conf"

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g status-position top
set -g status-style "bg=#181427,fg=#D8C9A2"
set -g message-style "bg=#49414d,fg=#e0d4b5"
set -g pane-border-style "fg=#49414d"
set -g pane-active-border-style "fg=#C56A4A"
set -g status-left "#[fg=#C56A4A,bold] 󰆍 #S #[default]"
set -g status-right "#[fg=#85c6ae]#(whoami)@#H #[fg=#8f8376]%a %d %b %H:%M "
set -g status-left-length 32
set -g status-right-length 60
setw -g window-status-format " #[fg=#8f8376]#I:#W "
setw -g window-status-current-format "#[bg=#49414d,fg=#e0d4b5,bold] #I:#W #[default]"
set -g clock-mode-colour "#C56A4A"
set -g mode-style "bg=#49414d,fg=#e0d4b5"

# Select the pane under the pointer without clicking.
set -g mouse on
set -g focus-follows-mouse on

# Forward the active pane title to Sway and the workspace decoration.
set -g set-titles on
set -g set-titles-string "#{pane_title}"
