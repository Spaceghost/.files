# Keep personal controls independent of theme colors and plugin managers.
source-file "$HOME/.config/tmux/oldbook.conf"

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g status-position top
set -g status-style "bg=#07121d,fg=#E8DFC8"
set -g message-style "bg=#3a444a,fg=#ede5d3"
set -g pane-border-style "fg=#3a444a"
set -g pane-active-border-style "fg=#42C7C5"
set -g status-left "#[fg=#42C7C5,bold] 󰆍 #S #[default]"
set -g status-right "#[fg=#70d5c2]#(whoami)@#H #[fg=#8f8f88]%a %d %b %H:%M "
set -g status-left-length 32
set -g status-right-length 60
setw -g window-status-format " #[fg=#8f8f88]#I:#W "
setw -g window-status-current-format "#[bg=#3a444a,fg=#ede5d3,bold] #I:#W #[default]"
set -g clock-mode-colour "#42C7C5"
set -g mode-style "bg=#3a444a,fg=#ede5d3"

# Select the pane under the pointer without clicking.
set -g mouse on
set -g focus-follows-mouse on

# Forward the active pane title to Sway and the workspace decoration.
set -g set-titles on
set -g set-titles-string "#{pane_title}"
