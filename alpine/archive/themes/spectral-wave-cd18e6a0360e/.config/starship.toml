add_newline = false
format = "$username$hostname$directory${custom.fossil}$git_branch$git_status$cmd_duration$line_break$character"

[username]
show_always = true
style_user = "bold #42C7C5"
style_root = "bold #c08a85"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "#70d5c2"
format = "[@$hostname]($style) "

[directory]
style = "bold #E8DFC8"
truncation_length = 4
truncate_to_repo = false
read_only = " 󰌾"

[git_branch]
symbol = "󰘬 "
style = "#a685d5"

[git_status]
style = "#c0a785"

[cmd_duration]
min_time = 500
format = " [󱎫 $duration]($style)"
style = "#70b4d5"

[character]
success_symbol = "[❯](bold #84d585)"
error_symbol = "[❯](bold #c08a85)"

[custom.fossil]
command = "fossil branch current"
when = "fossil info >/dev/null 2>&1"
format = " [󰜘 $output]($style)"
style = "bold #42C7C5"
shell = ["sh"]
