# Geometry is shared by all desktop menus. oldbook-fuzzel supplies active theme colors.
[main]
font=Inter:size=13
terminal=foot -e
prompt="Applications ❯ "
layer=overlay
lines=10
width=52
horizontal-pad=23
vertical-pad=20
inner-pad=14
line-height=28
image-size-ratio=0.55
icons-enabled=yes
fields=name,generic,comment,categories,filename,keywords
show-actions=yes

[colors]
background=091827ff
text=E8DFC8ff
match=42C7C5ff
selection=3a444aff
selection-text=ede5d3ff
selection-match=c0a785ff
border=84d585ff

[border]
width=1
radius=14
