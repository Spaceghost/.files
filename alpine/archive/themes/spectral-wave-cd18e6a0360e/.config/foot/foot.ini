[main]
selection-target=both
term=xterm-256color
font=JetBrainsMono Nerd Font:size=9.5
font-bold=JetBrainsMono Nerd Font:style=Bold:size=9.5
font-italic=JetBrainsMono Nerd Font:style=Italic:size=9.5
shell=zsh
pad=7x7 center
resize-delay-ms=40
initial-window-size-chars=106x30
initial-color-theme=dark

# Gruvbox Dark: warm charcoal, cream text, and the original 16-color palette.
[colors-dark]
alpha=0.8
alpha-mode=all
foreground=E8DFC8
background=091827
selection-foreground=ede5d3
selection-background=3a444a
regular0=091827
regular1=c08a85
regular2=84d585
regular3=84d585
regular4=70b4d5
regular5=8f8f88
regular6=8f8f88
regular7=8f8f88
bright0=8f8f88
bright1=c08a85
bright2=84d585
bright3=42C7C5
bright4=70b4d5
bright5=a685d5
bright6=70d5c2
bright7=E8DFC8
cursor=091827 42C7C5
urls=70b4d5
jump-labels=091827 42C7C5
scrollback-indicator=091827 70b4d5
search-box-no-match=091827 c08a85
search-box-match=091827 84d585

[csd]
preferred=server
# Matching fallback when another Wayland compositor supplies no decorations.
size=18
font=Inter:size=9
color=ff091827
border-width=0
border-color=ff3a444a
button-color=ffE8DFC8
button-minimize-color=ff70b4d5
button-maximize-color=ff84d585
button-close-color=ffc08a85
