add_newline = false
format = "$username$hostname$directory${custom.fossil}$git_branch$git_status$cmd_duration$line_break$character"

[username]
show_always = true
style_user = "bold #D56A3A"
style_root = "bold #d87b6f"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "#88c6ab"
format = "[@$hostname]($style) "

[directory]
style = "bold #E7D8B5"
truncation_length = 4
truncate_to_repo = false
read_only = " 󰌾"

[git_branch]
symbol = "󰘬 "
style = "#bd77bf"

[git_status]
style = "#d8986f"

[cmd_duration]
min_time = 500
format = " [󱎫 $duration]($style)"
style = "#88a5bf"

[character]
success_symbol = "[❯](bold #9cc66f)"
error_symbol = "[❯](bold #d87b6f)"

[custom.fossil]
command = "fossil branch current"
when = "fossil info >/dev/null 2>&1"
format = " [󰜘 $output]($style)"
style = "bold #D56A3A"
shell = ["sh"]
