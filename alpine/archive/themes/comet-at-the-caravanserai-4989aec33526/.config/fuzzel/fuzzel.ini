# Geometry is shared by all desktop menus. oldbook-fuzzel supplies active theme colors.
[main]
font=DejaVu Serif:size=13
terminal=foot -e
prompt="Applications ❯ "
layer=overlay
lines=10
width=54
horizontal-pad=24
vertical-pad=20
inner-pad=14
line-height=28
image-size-ratio=0.55
icons-enabled=yes
fields=name,generic,comment,categories,filename,keywords
show-actions=yes

[colors]
background=172C2Aff
text=E7D8B5ff
match=D56A3Aff
selection=455249ff
selection-text=ece0c4ff
selection-match=d8986fff
border=9cc66fff

[border]
width=1
radius=8
