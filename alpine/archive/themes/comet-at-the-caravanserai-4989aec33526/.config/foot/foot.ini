[main]
selection-target=both
term=xterm-256color
font=JetBrainsMono Nerd Font:size=9.5
font-bold=JetBrainsMono Nerd Font:style=Bold:size=9.5
font-italic=JetBrainsMono Nerd Font:style=Italic:size=9.5
shell=zsh
pad=8x8 center
resize-delay-ms=40
initial-window-size-chars=106x30
initial-color-theme=dark

# Gruvbox Dark: warm charcoal, cream text, and the original 16-color palette.
[colors-dark]
alpha=0.93
alpha-mode=all
foreground=E7D8B5
background=172C2A
selection-foreground=ece0c4
selection-background=455249
regular0=172C2A
regular1=d87b6f
regular2=9cc66f
regular3=9cc66f
regular4=88a5bf
regular5=94937d
regular6=94937d
regular7=94937d
bright0=94937d
bright1=d87b6f
bright2=9cc66f
bright3=D56A3A
bright4=88a5bf
bright5=bd77bf
bright6=88c6ab
bright7=E7D8B5
cursor=172C2A D56A3A
urls=88a5bf
jump-labels=172C2A D56A3A
scrollback-indicator=172C2A 88a5bf
search-box-no-match=172C2A d87b6f
search-box-match=172C2A 9cc66f

[csd]
preferred=server
# Matching fallback when another Wayland compositor supplies no decorations.
size=18
font=Inter:size=9
color=ff172C2A
border-width=0
border-color=ff455249
button-color=ffE7D8B5
button-minimize-color=ff88a5bf
button-maximize-color=ff9cc66f
button-close-color=ffd87b6f
