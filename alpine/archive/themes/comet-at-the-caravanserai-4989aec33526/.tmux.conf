# Keep personal controls independent of theme colors and plugin managers.
source-file "$HOME/.config/tmux/oldbook.conf"

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g status-position top
set -g status-style "bg=#11211f,fg=#E7D8B5"
set -g message-style "bg=#455249,fg=#ece0c4"
set -g pane-border-style "fg=#455249"
set -g pane-active-border-style "fg=#D56A3A"
set -g status-left "#[fg=#D56A3A,bold] 󰆍 #S #[default]"
set -g status-right "#[fg=#88c6ab]#(whoami)@#H #[fg=#94937d]%a %d %b %H:%M "
set -g status-left-length 32
set -g status-right-length 60
setw -g window-status-format " #[fg=#94937d]#I:#W "
setw -g window-status-current-format "#[bg=#455249,fg=#ece0c4,bold] #I:#W #[default]"
set -g clock-mode-colour "#D56A3A"
set -g mode-style "bg=#455249,fg=#ece0c4"

# Select the pane under the pointer without clicking.
set -g mouse on
set -g focus-follows-mouse on

# Forward the active pane title to Sway and the workspace decoration.
set -g set-titles on
set -g set-titles-string "#{pane_title}"
