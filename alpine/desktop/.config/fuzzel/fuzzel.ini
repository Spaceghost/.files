# Geometry is shared by all desktop menus. mbp-intel-fuzzel supplies active theme colors.
[main]
font=JetBrainsMono Nerd Font:size=13
terminal=foot -e
prompt="Applications ❯ "
layer=overlay
lines=10
width=48
horizontal-pad=28
vertical-pad=20
inner-pad=14
line-height=28
image-size-ratio=0.55
icons-enabled=yes
fields=name,generic,comment,categories,filename,keywords
show-actions=yes

[colors]
background=282828ff
text=ebdbb2ff
match=fabd2fff
selection=504945ff
selection-text=fbf1c7ff
selection-match=fe8019ff
border=d79921ff

[border]
width=1
radius=12
