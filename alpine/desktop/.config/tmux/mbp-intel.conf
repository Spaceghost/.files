# Personal controls shared by every desktop theme; no plugin bootstrap.
# Ctrl+A twice sends Ctrl+A to the program in the pane.
unbind-key C-b
set -g prefix C-a
bind-key C-a send-prefix

set -g repeat-time 1000
set -s escape-time 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 10000

# Split side by side with v, | or Enter; split top/bottom with s.
bind-key v split-window -h
bind-key | split-window -h
bind-key Enter split-window -h
bind-key s split-window -v

# Vim selection and command prompts.
setw -g mode-keys vi
set -g status-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key -r C-h select-window -t :-
bind-key -r C-l select-window -t :+
bind-key -r Tab last-pane

# The historic config's final minus binding resizes down.
bind-key -r + resize-pane -U 5
bind-key -r - resize-pane -D 5
bind-key -r < resize-pane -L 5
bind-key -r > resize-pane -R 5
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

# Default 1-9 bindings already select those windows; 0 selects window 10.
bind-key 0 select-window -t 10
set -g mouse on
set -g set-clipboard on
# The default Enter/mouse-copy bindings and vi y share the desktop clipboard.
set -s copy-command "$HOME/.local/bin/mbp-intel-clipboard copy"
set -g focus-events on
setw -g monitor-activity on
set -g visual-activity off
