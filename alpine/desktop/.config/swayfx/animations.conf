# SwayFX r5 and later only. oldbook-sway probes the installed compositor and
# includes this file at login when the commands parse, so an older binary and a
# reload of the running session never see them.
#
# Native compositor motion keeps geometry coherent through interrupted frames.
# Workspace changes fade rather than moving the whole screen, while the two
# persistent top consoles get their own Quake-style vertical path.
animations enable

# Shared fallback for any kind left at zero below.
animation_duration_ms 140

animation_open_ms 160
animation_close_ms 130
animation_move_ms 140

# Persistent console reveal and dismissal. The criteria also provide square
# top corners so these read as attached consoles, not floating cards.
animation_dropdown_ms 190
animation_dropdown_close_ms 155
animation_dropdown_mark oldbook-dropdown
animation_dropdown_corner_radius 14

# Cross-workspace window selection crossfades in place; it never returns to the
# full-screen horizontal movement that made ordinary switching feel excessive.
animation_workspace_ms 180
animation_workspace_style fade
