# SwayFX r4 and later only. oldbook-sway probes the installed compositor and
# includes this file at login when the commands parse, so an older binary and a
# reload of the running session never see them.
#
# Animations are off. Jack asked for this permanently: switching workspaces or
# windows must never visibly slide or move anything, "now and forever" -- not a
# duration to tune down, the whole category of motion. The per-kind durations
# below are left in place, inert, so re-enabling later (should that ever be
# wanted) doesn't mean re-deriving them.
animations disable

# Shared fallback for any kind left at zero below.
animation_duration_ms 140

animation_open_ms 160
animation_close_ms 130
animation_move_ms 140

# The workspaces slide horizontally: the arriving one enters from the side its
# number lies on, the departing one leaves the other way. "fade" restores the
# stock crossfade and "both" does the two together.
animation_workspace_ms 220
animation_workspace_style slide
