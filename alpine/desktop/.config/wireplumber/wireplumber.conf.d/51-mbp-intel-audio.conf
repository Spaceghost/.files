# The MacBookPro11,5 CS4208 jack reports plugged with an empty socket.
monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "alsa_card.pci-0000_00_1b.0"
        api.alsa.card.name = "HDA Intel PCH"
      }
    ]
    actions = {
      update-props = {
        device.profile-set = "mbp-intel-cs4208.conf"
      }
    }
  }
]
