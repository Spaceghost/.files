# Apple / libinput touchpads. Two-finger gestures stay with applications.
input type:touchpad {
    tap enabled
    tap_button_map lrm
    drag enabled
    drag_lock disabled
    natural_scroll enabled
    scroll_method two_finger
    click_method clickfinger
}

# Natural direction: push the desktop left to reach the next one.
bindgesture swipe:3:left workspace next
bindgesture swipe:3:right workspace prev
bindgesture swipe:4:left workspace next
bindgesture swipe:4:right workspace prev
bindgesture swipe:3:up exec ~/.local/bin/mbp-intel-expo show
bindgesture swipe:3:down exec ~/.local/bin/mbp-intel-expo close

# Four fingers away clears the desktop. Down restores it, or opens the window
# carousel if nothing is hidden. Three fingers keep the workspace picker.
bindgesture swipe:4:up exec ~/.local/bin/mbp-intel-showdesktop show
bindgesture swipe:4:down exec ~/.local/bin/mbp-intel-showdesktop restore-or-carousel
bindgesture pinch:4:inward exec ~/.local/bin/mbp-intel-menu
bindgesture pinch:4:outward exec ~/.local/bin/mbp-intel-expo close
bindsym Mod4+e exec ~/.local/bin/mbp-intel-expo toggle
