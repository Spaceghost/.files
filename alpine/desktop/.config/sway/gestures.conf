# Apple / libinput touchpads. Two-finger gestures stay with applications.
input type:touchpad {
    tap enabled
    tap_button_map lrm
    drag enabled
    drag_lock disabled
    natural_scroll enabled
    scroll_method two_finger
    click_method clickfinger
}

# Natural direction: push the desktop left to reach the next one.
bindgesture swipe:3:left workspace next
bindgesture swipe:3:right workspace prev
bindgesture swipe:4:left workspace next
bindgesture swipe:4:right workspace prev
bindgesture swipe:3:up exec ~/.local/bin/oldbook-expo show
bindgesture swipe:4:up exec ~/.local/bin/oldbook-expo show
bindgesture swipe:3:down exec ~/.local/bin/oldbook-expo close
bindgesture swipe:4:down exec ~/.local/bin/oldbook-expo close
bindgesture pinch:4:inward exec ~/.local/bin/oldbook-menu
bindgesture pinch:4:outward exec ~/.local/bin/oldbook-expo close
bindsym Mod4+e exec ~/.local/bin/oldbook-expo toggle
