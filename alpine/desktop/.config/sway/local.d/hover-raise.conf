# Focus follows the pointer immediately; raise a floating window after 1s dwell.
# Runtime IPC keeps reloads valid on an older running Sway/SwayFX binary.
# The patched SwayFX package enables the command on the next graphical login.
focus_follows_mouse yes
exec_always --no-startup-id swaymsg -q 'mouse_raise_delay 1000' >/dev/null 2>&1
