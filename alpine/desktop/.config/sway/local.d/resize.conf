# Resize the focused window from its center, 20 logical pixels per edge.
# The unshifted = key and the shifted + symbol both grow the window.
bindsym $mod+equal exec ~/.local/bin/oldbook-resize grow
bindsym $mod+plus exec ~/.local/bin/oldbook-resize grow
bindsym $mod+Shift+plus exec ~/.local/bin/oldbook-resize grow
bindsym $mod+minus exec ~/.local/bin/oldbook-resize shrink
bindsym $mod+KP_Add exec ~/.local/bin/oldbook-resize grow
bindsym $mod+KP_Subtract exec ~/.local/bin/oldbook-resize shrink
