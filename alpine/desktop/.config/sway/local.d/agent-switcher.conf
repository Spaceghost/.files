# Agent-only Alt+Tab. Repeated bindings signal one transient popup; releasing
# either final Alt key accepts its highlighted window and Escape cancels.
bindsym Mod1+Tab exec ~/.local/bin/oldbook-agent-switcher next
bindsym Mod1+Shift+Tab exec ~/.local/bin/oldbook-agent-switcher previous

# Once the popup maps it enters this mode, so Tab repeats are ordered in its
# own GTK event stream with the final Alt release. Escape also recovers the
# default mode if the popup has exited unexpectedly.
mode "agent-switcher" {
    bindsym Escape exec ~/.local/bin/oldbook-agent-switcher cancel, mode "default"
    bindsym Mod1+Escape exec ~/.local/bin/oldbook-agent-switcher cancel, mode "default"
}
