# Keep the console on ` and the system monitor on ~ (Shift+` on this keyboard).
bindsym $mod+grave exec ~/.local/bin/mbp-intel-dropdown
bindsym $mod+asciitilde exec ~/.local/bin/mbp-intel-dropdown monitor
# Retain the legacy Foot rule so an existing shell stays recoverable.
for_window [app_id="^(com[.]mbp-intel[.](dropdown|monitor)|mbp-intel-dropdown)$"] floating enable, border pixel 0, move scratchpad
