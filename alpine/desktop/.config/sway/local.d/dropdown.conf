# Both the unshifted ` key and literal ~ toggle the same persistent terminal.
bindsym $mod+grave exec ~/.local/bin/oldbook-dropdown
bindsym $mod+asciitilde exec ~/.local/bin/oldbook-dropdown
# Retain the legacy Foot rule so an existing shell stays recoverable.
for_window [app_id="^(com[.]oldbook[.]dropdown|oldbook-dropdown)$"] floating enable, border pixel 0, move scratchpad
