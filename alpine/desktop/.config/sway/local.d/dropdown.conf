# Keep the console on ` and the system monitor on ~ (Shift+` on this keyboard).
bindsym $mod+grave exec ~/.local/bin/oldbook-dropdown
bindsym $mod+asciitilde exec ~/.local/bin/oldbook-dropdown monitor
# Retain the legacy Foot rule so an existing shell stays recoverable.
for_window [app_id="^(com[.]oldbook[.](dropdown|monitor)|oldbook-dropdown)$"] floating enable, border pixel 0, move scratchpad
