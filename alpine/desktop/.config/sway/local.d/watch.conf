# Watch mode: a cat guard, not a lock.
#
# Super+Shift+Escape parks input off the desktop while leaving the desktop
# itself fully visible and fully running, so a long job can be watched — and
# sat on by a cat — without a key or a paw reaching the session. The real lock
# is Super+Escape and is untouched; watch mode stops nobody who can reach the
# machine, and must never be described as security.
#
# Leaving: hold Super+Shift+Escape for a second with no other key down. The
# guard surface owns the keyboard and decides that itself, which is why no
# release binding is needed here.
bindsym $mod+Shift+Escape exec ~/.local/bin/oldbook-watch start

# Deliberately almost empty. A transparent overlay surface takes the keyboard
# and every pointer event, but Sway processes its own bindings first, so
# without an empty mode a cat lying across the keyboard would still reach
# $mod+Shift+q and kill a window. Anything not bound here does not exist while
# watch mode holds the desktop, gestures and --locked bindings included.
mode "watch" {
    # The emergency exit, for the one case the guard itself is wedged: four
    # modifiers and a letter, which is deliberate for a person and awkward for
    # a paw. The mode is restored first so this works even if the exec does
    # not. Killing the guard also restores the mode on its own — it holds a
    # watchdog pipe for exactly that.
    bindsym Ctrl+Mod1+Shift+Mod4+w mode "default", exec ~/.local/bin/oldbook-watch stop
}
