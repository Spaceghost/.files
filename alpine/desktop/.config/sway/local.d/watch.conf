# Catbed mode: a cat guard, not a lock.
#
# Super+Shift+Escape parks input off the desktop while leaving the desktop
# itself fully visible and fully running, so a long job can be watched — and
# sat on by a cat — without a key or a paw reaching the session. The real lock
# is Super+Escape and is untouched; catbed mode stops nobody who can reach the
# machine, and must never be described as security.
#
# Leaving: hold Super+Shift+Escape for a second with no other key down. The
# guard surface owns the keyboard and decides that itself, which is why no
# release binding is needed here. Nothing else leaves — not the cat getting
# up, not the screen locking and unlocking, not a reload.
bindsym $mod+Shift+Escape exec ~/.local/bin/oldbook-watch start

# Deliberately empty. A transparent overlay surface takes the keyboard and
# every pointer event, but Sway processes its own bindings first, so without
# an empty mode a cat lying across the keyboard would still reach
# $mod+Shift+q and kill a window. Anything not bound here does not exist while
# catbed mode holds the desktop, gestures and --locked bindings included.
#
# There is no exit chord in here on purpose: a settled cat holds several keys
# at once, and any chord Sway would answer is a chord she can produce. If the
# guard is ever wedged, `oldbook-watch stop` from a terminal or over SSH
# restores the mode, and so does killing the guard — it holds a watchdog pipe
# for exactly that. The guard re-enters this mode itself if a reload resets it.
mode "watch" {
    # Sway creates a mode only when a line inside its block runs: the opener
    # above is a block start, not a command, so an empty block leaves no mode
    # at all, `swaymsg mode watch` is refused as unknown, and the guard reads
    # that refusal as "do not start". `set` is the one subcommand a mode block
    # accepts that binds nothing; this line exists so that the mode does.
    set $catbed_mode_exists 1
}
