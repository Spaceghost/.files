# hid_apple auto mode on this MacBook sends these from F5/F6 without Fn.
# Fn+F5/F6 retain their application function-key behavior.
bindsym --locked XF86KbdBrightnessDown exec ~/.local/bin/oldbook-keyboard-backlight down
bindsym --locked XF86KbdBrightnessUp exec ~/.local/bin/oldbook-keyboard-backlight up
bindsym --locked XF86KbdLightOnOff exec ~/.local/bin/oldbook-keyboard-backlight toggle
bindsym --locked Shift+XF86KbdBrightnessUp exec ~/.local/bin/oldbook-keyboard-backlight breathe
bindsym --locked Shift+XF86KbdBrightnessDown exec ~/.local/bin/oldbook-keyboard-backlight steady
bindsym --locked Ctrl+XF86KbdBrightnessUp exec ~/.local/bin/oldbook-keyboard-backlight typing
bindsym --locked Ctrl+XF86KbdBrightnessDown exec ~/.local/bin/oldbook-keyboard-backlight typing-dark
bindsym --locked Ctrl+Shift+XF86KbdBrightnessUp exec ~/.local/bin/oldbook-keyboard-backlight typing-wpm
bindsym --locked Ctrl+Shift+XF86KbdBrightnessDown exec ~/.local/bin/oldbook-keyboard-backlight typing-dark-wpm

# Preserve level and breathing preference across logins; reloads leave them alone.
exec --no-startup-id ~/.local/bin/oldbook-keyboard-backlight restore
