# hid_apple auto mode on this MacBook sends these from F5/F6 without Fn.
# Fn+F5/F6 retain their application function-key behavior.
bindsym --locked XF86KbdBrightnessDown exec ~/.local/bin/mbp-intel-keyboard-backlight down
bindsym --locked XF86KbdBrightnessUp exec ~/.local/bin/mbp-intel-keyboard-backlight up
bindsym --locked XF86KbdLightOnOff exec ~/.local/bin/mbp-intel-keyboard-backlight toggle

# Preserve the chosen level, including off, across logins; first use starts at 25%.
exec --no-startup-id ~/.local/bin/mbp-intel-keyboard-backlight restore
