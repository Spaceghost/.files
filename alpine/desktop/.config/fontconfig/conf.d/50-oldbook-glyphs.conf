<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Where the drawing glyphs come from.

  The desktop draws meters, bars, sparklines and frames out of characters
  rather than pictures, and JetBrains Mono Nerd Font — the face every terminal,
  the panel and the on-screen pill ask for by name — does not contain most of
  them. It has the block elements and box drawing, but it is missing the
  segmented bar (U+25B0 ▰ and U+25B1 ▱), the whole Braille Patterns block used
  for sparklines, the circle fractions (U+25D0 ◐) and every sextant in Symbols
  for Legacy Computing.

  Left alone, fontconfig answers those with whatever it finds first, and it
  does not find the same face twice: the segmented bar resolves to DejaVu Sans
  Mono while Braille and the sextants resolve to Adwaita Mono. So a single
  string that mixes a bar with a sparkline is drawn from two different
  fallback faces with two different sets of metrics. A terminal hides that
  because it forces its own cell grid; Waybar and the GTK overlays lay text
  out proportionally and do not hide it.

  Adwaita Mono carries every one of those ranges and is monospaced, so naming
  it as the preferred fallback keeps one set of metrics across the terminal,
  the panel and the overlays. It comes from the Alpine package
  adwaita-fonts-mono, which is already present; nothing here installs it, so a
  machine without that package simply falls back as it did before.

  Weak binding throughout: this states a preference for glyphs the requested
  face does not have, and must never displace a face somebody asked for.
-->
<fontconfig>

  <!-- The face named explicitly by foot, Waybar, the OSD and conky. -->
  <match target="pattern">
    <test name="family" compare="contains"><string>JetBrainsMono</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>Adwaita Mono</string>
    </edit>
  </match>

  <!-- Anything asking for the generic alias gets the same coverage. -->
  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>Adwaita Mono</string>
    </edit>
  </match>

  <!-- Symbols Nerd Font is icons only and has no Latin text or drawing glyphs;
       the panel names it first on its icon labels, so it needs the same tail. -->
  <match target="pattern">
    <test name="family" compare="contains"><string>Symbols Nerd Font</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>Adwaita Mono</string>
    </edit>
  </match>

</fontconfig>
