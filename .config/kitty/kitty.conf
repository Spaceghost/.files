# S P A C E G H O S T  /  K I T T Y
font_family      Fira Code
symbol_map U+E000-U+F8FF,U+F0000-U+FFFFF Symbols Nerd Font Mono
font_size        15
modify_font cell_height 110%
window_padding_width 10 12
background_opacity 0.92
cursor_shape beam
cursor_blink_interval 0
copy_on_select clipboard
hide_window_decorations yes
confirm_os_window_close 0
scrollback_lines 0
enable_audio_bell no
# The shell is Neovim (see ~/.zshrc); kitty only draws it.

background #0b0d16
foreground #e8edf7
cursor #79efc2
cursor_text_color #0b0d16
selection_background #b4a1ff
selection_foreground #0b0d16
url_color #7fe3f0
color0 #161a2b
color1 #ff7597
color2 #79efc2
color3 #f3c969
color4 #7fb7ff
color5 #b4a1ff
color6 #7fe3f0
color7 #e8edf7
color8 #5a6280
color9 #ff9ab5
color10 #a6f5d8
color11 #f8dc96
color12 #a9cfff
color13 #cfc4ff
color14 #aeeef6
color15 #ffffff
