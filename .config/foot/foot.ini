# S P A C E G H O S T  /  F O O T
[main]
font=Fira Code:size=13, Symbols Nerd Font Mono:size=13
line-height=18
pad=12x10 center
selection-target=clipboard
# The shell is Neovim (see ~/.zshrc); foot only draws it.

[scrollback]
lines=0

[cursor]
style=beam
blink=no
color=0b0d16 79efc2

[mouse]
hide-when-typing=yes

[colors]
alpha=0.92
background=0b0d16
foreground=e8edf7
selection-foreground=0b0d16
selection-background=b4a1ff
urls=7fe3f0
regular0=161a2b
regular1=ff7597
regular2=79efc2
regular3=f3c969
regular4=7fb7ff
regular5=b4a1ff
regular6=7fe3f0
regular7=e8edf7
bright0=5a6280
bright1=ff9ab5
bright2=a6f5d8
bright3=f8dc96
bright4=a9cfff
bright5=cfc4ff
bright6=aeeef6
bright7=ffffff

[key-bindings]
# Neovim owns tabs/splits; keep foot's own bindings minimal.
scrollback-up-page=none
scrollback-down-page=none
