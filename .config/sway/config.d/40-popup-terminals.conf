# Guake-style transparent terminal on the key below Escape.
bindsym $mod+grave exec $HOME/.local/bin/sway-popup-terminal dropdown

# htop popup on Super+Shift+grave, i.e. Super+tilde.
bindsym $mod+Shift+grave exec $HOME/.local/bin/sway-popup-terminal htop

for_window [app_id="sway-dropdown-terminal"] floating enable, sticky enable, border pixel 1, resize set width 100 ppt height 45 ppt, move position 0 ppt 0 ppt
for_window [app_id="sway-htop"] floating enable, sticky enable, border pixel 1, resize set width 72 ppt height 68 ppt, move position center
