exec sh -lc 'command -v swaync >/dev/null && swaync'
exec sh -lc 'gsettings set org.gnome.desktop.interface color-scheme prefer-dark'
exec sh -lc 'gsettings set org.gnome.desktop.interface gtk-theme Adwaita-dark'
exec sh -lc 'gsettings set org.gnome.desktop.interface icon-theme Papirus-Dark 2>/dev/null || true'

