# Shared by upstream Sway and SwayFX.
set $term foot
set $menu rofi -show drun

font pango:Adwaita Sans 10
default_border pixel 2
default_floating_border normal 2
gaps inner 8
gaps outer 14
smart_gaps on
smart_borders on
titlebar_padding 8 4

# Catppuccin Mocha: border, background, text, indicator, child border.
client.focused          #89b4fa #1e1e2e #cdd6f4 #89b4fa #89b4fa
client.focused_inactive #45475a #181825 #bac2de #45475a #45475a
client.unfocused        #313244 #11111b #a6adc8 #313244 #313244
client.urgent           #f38ba8 #1e1e2e #cdd6f4 #f38ba8 #f38ba8
client.placeholder      #313244 #11111b #a6adc8 #313244 #313244

output * bg ~/.config/sway/wallpaper.svg fill

input type:touchpad {
    tap enabled
    natural_scroll enabled
    dwt enabled
}

seat seat0 xcursor_theme Adwaita 24

for_window [app_id="pavucontrol"] floating enable, resize set 920 620, move position center
for_window [app_id="nm-connection-editor"] floating enable, resize set 920 620, move position center
for_window [app_id="blueman-manager"] floating enable, resize set 820 560, move position center

