# Explicitly replace Fedora's defaults where we want a cohesive desktop.
bindsym $mod+Return exec foot
bindsym $mod+d exec rofi -show drun
bindsym $mod+Shift+d exec sh -lc 'command -v nwg-drawer >/dev/null && nwg-drawer'
bindsym $mod+n exec sh -lc 'command -v swaync-client >/dev/null && swaync-client -t -sw'
bindsym $mod+Shift+b exec ~/.local/bin/desktop-panel-toggle
bindsym $mod+Shift+e exec ~/.local/bin/desktop-power-menu
bindsym $mod+Shift+l exec loginctl lock-session

