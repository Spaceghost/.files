# Explicitly replace Fedora's defaults where we want a cohesive desktop.
bindsym --no-warn $mod+Return exec foot
bindsym --no-warn $mod+d exec rofi -show drun
bindsym --no-warn $mod+Shift+d exec sh -lc 'command -v nwg-drawer >/dev/null && nwg-drawer'
bindsym --no-warn $mod+n exec sh -lc 'command -v swaync-client >/dev/null && swaync-client -t -sw'
bindsym --no-warn $mod+Shift+b exec ~/.local/bin/desktop-panel-toggle
bindsym --no-warn $mod+Shift+e exec ~/.local/bin/desktop-power-menu
bindsym --no-warn $mod+Shift+l exec ~/.local/bin/desktop-lock
