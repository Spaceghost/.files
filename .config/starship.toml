"$schema" = 'https://starship.rs/config-schema.json'
palette = 'spaceghost'
add_newline = false
format = """
[╭─](fg:violet)$directory$git_branch$git_status$cmd_duration$fill$time
[╰─](fg:violet)$character"""

[palettes.spaceghost]
violet = '#b4a1ff'
mint = '#79efc2'
amber = '#f3c969'
alert = '#ff7597'
blue = '#7fb7ff'
muted = '#8992ad'

[directory]
style = 'bold violet'
format = '[ 󰉋 $path ]($style)'
truncation_length = 4
truncate_to_repo = false
read_only = ' 󰌾'

[git_branch]
symbol = ' '
style = 'bold mint'
format = '[on $symbol$branch ]($style)'

[git_status]
style = 'amber'
format = '([$all_status$ahead_behind ]($style))'
conflicted = '≠'
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
modified = '●'
staged = '✚'
untracked = '…'

[cmd_duration]
min_time = 500
style = 'muted'
format = '[󱎫 $duration ]($style)'

[fill]
symbol = ' '

[time]
disabled = false
time_format = '%H:%M'
style = 'muted'
format = '[ $time]($style)'

[character]
success_symbol = '[❯](bold mint) '
error_symbol = '[❯](bold alert) '
vimcmd_symbol = '[❮](bold violet) '
