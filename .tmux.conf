# C-a, like screen, while still allowing C-a through to nested sessions.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g status-position top
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -s escape-time 0
set -g repeat-time 500
set -g history-limit 100000
set -g mouse on
set -g focus-events on
set -g set-clipboard on

setw -g mode-keys vi
set -g status-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Keep new work in the current directory.
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vim-shaped navigation and resizing.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+
bind Tab last-window

# Direct window selection is faster than cycling when the destination is known.
bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5
bind 6 select-window -t 6
bind 7 select-window -t 7
bind 8 select-window -t 8
bind 9 select-window -t 9
bind 0 select-window -t 10

bind '~' display-popup -E -w 90% -h 90% htop
bind r source-file ~/.tmux.conf \; display-message 'reloaded ~/.tmux.conf'

set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm*:RGB'
set -g set-titles on
set -g set-titles-string '[#S:#I] #W'

# A quiet status line: session, windows, then time and host.
set -g status-interval 15
set -g status-style 'bg=colour234,fg=colour250'
set -g status-left ' #S '
set -g status-right '#[fg=colour245]%Y-%m-%d %H:%M #[fg=colour250]#H '
setw -g window-status-format ' #I:#W#F '
setw -g window-status-current-format '#[fg=colour39,bold] #I:#W#F '
set -g pane-border-style 'fg=colour238'
set -g pane-active-border-style 'fg=colour39'
set -g message-style 'fg=colour16,bg=colour221,bold'
