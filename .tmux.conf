# Prefix and responsiveness
unbind C-b
set -g prefix C-a
bind C-a send-prefix
set -s escape-time 0
set -g repeat-time 500

# Predictable numbering and long scrollback
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 100000

# Terminal behavior
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm*:RGB'
set -g focus-events on
set -g set-clipboard on
set -g mouse on

# New panes and windows inherit the current directory
unbind %
unbind '"'
bind v split-window -h -c '#{pane_current_path}'
bind s split-window -v -c '#{pane_current_path}'
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'

# Vim-style navigation and resizing
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r C-h previous-window
bind -r C-l next-window
bind Tab last-window

# Vi copy mode; OSC 52/system integration is handled by set-clipboard.
setw -g mode-keys vi
set -g status-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Direct window selection
bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5
bind 6 select-window -t 6
bind 7 select-window -t 7
bind 8 select-window -t 8
bind 9 select-window -t 9
bind 0 select-window -t 10

# A quiet status line with the useful bits only
set -g status-position top
set -g status-interval 15
set -g status-style 'fg=colour250,bg=colour234'
set -g status-left-length 40
set -g status-right-length 80
set -g status-left '#[fg=colour39,bold] #S #[default]'
set -g status-right '#[fg=colour245]%Y-%m-%d %H:%M #[fg=colour39]#H '
setw -g window-status-format ' #I:#W '
setw -g window-status-current-format '#[fg=colour234,bg=colour39,bold] #I:#W #[default]'
set -g pane-border-style 'fg=colour238'
set -g pane-active-border-style 'fg=colour39'
set -g message-style 'fg=colour16,bg=colour221,bold'

bind r source-file ~/.tmux.conf \; display-message 'reloaded ~/.tmux.conf'
