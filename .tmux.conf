# S P A C E G H O S T  /  M I S S I O N  C O N T R O L
# Void black. Spectral violet. Ion mint. Signal amber.
# Ctrl-a Ctrl-Space = command deck | Ctrl-a F1 = field guide | Ctrl-a R = reload
# Guide: docs/tmux-spaceghost.md in Spaceghost/.files
# Targets tmux 3.3+; verified on 3.7c. No icon font or helper daemon required.

# ── Flight controls ────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix
set -g repeat-time 1000
set -s escape-time 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g focus-events on
set -s set-clipboard on
set -g history-limit 100000
# Prefer modern terminfo when installed; remain usable on lean remote hosts.
set -s default-terminal 'screen-256color'
if-shell 'test -n "$(TERM=tmux-256color tput colors 2>/dev/null)"' 'set -s default-terminal tmux-256color'
# Keep capability detection honest for older/remote terminals.
set -s terminal-features[90] 'xterm-ghostty:RGB'
set -s terminal-features[91] 'tmux-256color:RGB'
set -s terminal-features[92] 'foot*:RGB'
set -s terminal-features[93] 'xterm-kitty:RGB'
setw -g mode-keys vi
set -g status-keys vi
setw -g aggressive-resize on
setw -g monitor-activity on
setw -g monitor-silence 30
set -g silence-action none
set -g visual-silence off
set -g visual-activity off
set -g activity-action none
set -g set-titles on
# Forward agent task/state titles to terminal and desktop decorations.
set -g set-titles-string '#{pane_title}'

# ── Existing plugins and recovery policy ───────────────────────────────────────
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-save 'S'
set -g @resurrect-processes '~VimR -> vimr codex "~codex-keepalive"'
# Manual only: Ctrl-a Shift-s saves; Ctrl-a Ctrl-r restores.
set -g @continuum-save-interval '0'
set -g @continuum-restore 'off'
set -g @continuum-boot 'off'
set -g @scroll-without-changing-pane 'on'
set -g @scroll-in-moused-over-pane 'off'
set -g @scroll-speed-num-lines-per-scroll '1'
set -g @emulate-scroll-for-no-mouse-alternate-buffer 'on'
set -g @sidebar-tree-command 'tree -C'
set -g @sidebar-tree-position 'left'
set -g @sidebar-tree 'C-Tab'
set -g @sidebar-tree-focus 'C-S-Tab'
set -g @sidebar-tree-pager 'less -R'
set -g @sidebar-tree-width '30'
set -g @cpu_low_icon '-'
set -g @cpu_medium_icon '='
set -g @cpu_high_icon '≣'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'
set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin 'tmux-plugins/tmux-net-speed'
set -g @plugin 'tmux-plugins/tmux-sidebar'
# Services sometimes launch tmux without HOME; preserve your existing workaround.
run-shell 'eval "login_home=~$(id -un)"; tmux set-environment -g HOME "$login_home"'
if-shell 'test -f ~/.tmux/plugins/tpm/tpm' 'run-shell ~/.tmux/plugins/tpm/tpm'

# Intentional final overrides: plugins cannot replace the theme or your controls.
# ── Navigation / splits ────────────────────────────────────────────────────────
set -g status-keys vi
unbind -q C-s
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
# Restore the window switching intent of your original config after pain-control.
bind -r C-h previous-window
bind -r C-l next-window
bind -r Tab last-pane
bind a last-window
bind c new-window -c '#{pane_current_path}'
bind v split-window -h -c '#{pane_current_path}'
bind s split-window -v -c '#{pane_current_path}'
bind '|' split-window -h -c '#{pane_current_path}'
bind '-' split-window -v -c '#{pane_current_path}'
bind Enter split-window -h -c '#{pane_current_path}'
bind 0 select-window -t :10
bind w choose-tree -Zw
bind b choose-buffer -Z
bind N if-shell -F '#{==:#{pane-border-status},off}' 'set -w pane-border-status top' 'set -w pane-border-status off'
bind r source-file ~/.tmux.conf \; display-message 'SPACEGHOST / systems reloaded'
bind R source-file ~/.tmux.conf \; display-message 'SPACEGHOST / systems reloaded'
bind B if-shell -F '#{==:#{status},2}' 'set status on' 'set status 2'
bind Space next-layout
bind M-Space next-layout
# A disposable shell over your workspace. Exit/Ctrl-d closes it.
bind '`' display-popup -E -w 85% -h 75% -d '#{pane_current_path}' -T ' SPACEGHOST / scratch terminal '
# Preserve your man-page, process monitor, and remote-host shortcuts.
bind '?' command-prompt -p 'man?' "split-window 'exec man %%'"
bind '~' split-window 'exec htop'
bind A command-prompt -p 'AutoSSH to Host:' "if-shell '[ -n \"%%\"' 'new-window -n \"%1\" \"/usr/local/bin/autossh %1\"'"
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send-keys -X cancel

# ── Geometry mode: Ctrl-a Ctrl-e, then resize without repeating the prefix ──────
bind C-e switch-client -T spaceghost-resize
bind -T spaceghost-resize h resize-pane -L 3 \; switch-client -T spaceghost-resize
bind -T spaceghost-resize j resize-pane -D 3 \; switch-client -T spaceghost-resize
bind -T spaceghost-resize k resize-pane -U 3 \; switch-client -T spaceghost-resize
bind -T spaceghost-resize l resize-pane -R 3 \; switch-client -T spaceghost-resize
bind -T spaceghost-resize H resize-pane -L 10 \; switch-client -T spaceghost-resize
bind -T spaceghost-resize J resize-pane -D 10 \; switch-client -T spaceghost-resize
bind -T spaceghost-resize K resize-pane -U 10 \; switch-client -T spaceghost-resize
bind -T spaceghost-resize L resize-pane -R 10 \; switch-client -T spaceghost-resize
bind -T spaceghost-resize Left resize-pane -L 3 \; switch-client -T spaceghost-resize
bind -T spaceghost-resize Down resize-pane -D 3 \; switch-client -T spaceghost-resize
bind -T spaceghost-resize Up resize-pane -U 3 \; switch-client -T spaceghost-resize
bind -T spaceghost-resize Right resize-pane -R 3 \; switch-client -T spaceghost-resize
bind -T spaceghost-resize '=' select-layout -E \; switch-client -T spaceghost-resize
bind -T spaceghost-resize Space next-layout \; switch-client -T spaceghost-resize
bind -T spaceghost-resize q switch-client -T root
bind -T spaceghost-resize Escape switch-client -T root
bind -T spaceghost-resize Enter switch-client -T root
bind -T spaceghost-resize C-c switch-client -T root
# Unknown keys leave the mode without sending accidental input to the application.
bind -T spaceghost-resize Any switch-client -T root

# Git work happens only on demand. -d passes cwd without interpolating it in a shell.
bind g display-popup -E -w 90% -h 80% -d '#{pane_current_path}' -T ' SPACEGHOST / git observatory ' "git --no-pager -c color.ui=always status --short --branch --untracked-files=no; printf '\\nRECENT COMMITS\\n\\n'; git --no-pager -c color.ui=always log --oneline --decorate -12; printf '\\nEnter to close'; read -r spaceghost_reply"

# ── Command deck ──────────────────────────────────────────────────────────────
bind C-Space display-menu -T ' SPACEGHOST / command deck ' -x C -y C -- \
    'New window' c 'new-window -c "#{pane_current_path}"' \
    'Split right' v 'split-window -h -c "#{pane_current_path}"' \
    'Split below' s 'split-window -v -c "#{pane_current_path}"' \
    'Zoom / unzoom' z 'resize-pane -Z' \
    'Cycle layout' l 'next-layout' \
    'Geometry / resize mode' e 'switch-client -T spaceghost-resize' \
    'Pane labels on / off' N 'if-shell -F "#{==:#{pane-border-status},off}" "set -w pane-border-status top" "set -w pane-border-status off"' \
    '' \
    'Sessions + windows' w 'choose-tree -Zw' \
    'Paste buffers' b 'choose-buffer -Z' \
    'Scratch terminal' t 'display-popup -E -w 85% -h 75% -d "#{pane_current_path}" -T " SPACEGHOST / scratch terminal "' \
    'Rename window' ',' 'command-prompt -I "#W" "rename-window %%"' \
    '' \
    'Save session snapshot' S 'run-shell ~/.tmux/plugins/tmux-resurrect/scripts/save.sh' \
    'Compact / full HUD' B 'if-shell -F "#{==:#{status},2}" "set status on" "set status 2"' \
    'Reload configuration' r 'source-file ~/.tmux.conf' \
    '-Ctrl-a F1: field guide' '' ''

bind F1 display-menu -T ' SPACEGHOST / flight manual ' -x C -y C -- \
    '-PREFIX: Ctrl-a    /    repeat Ctrl-a to send it through' '' '' \
    '' \
    '-Ctrl-Space   command deck     Ctrl-e    geometry mode' '' '' \
    '-h j k l      focus pane       H J K L   resize pane' '' '' \
    '-v / |        split right      s / -     split below' '' '' \
    '-c            new window       w         session tree' '' '' \
    '-Ctrl-h/l     prev/next window Tab / a   last pane/window' '' '' \
    '-z            zoom pane        N         pane labels' '' '' \
    '-`            scratch shell    g         git observatory' '' '' \
    '-[ then v/y   select/copy       b / ]     buffers/paste' '' '' \
    '-S / Ctrl-r   save/restore     r / R     reload config' '' '' \
    '-B            compact HUD      Space     cycle layout' '' '' \
    '' \
    '-NOW selected    NEW unread    READY/BUSY agent state' '' '' \
    '-QUIET: no output for 30s; a process may still be working' '' '' \
    '-Geometry: hjkl 3 cells / HJKL 10 / = balance / q exit' '' '' \
    '' \
    'Close' q ''

# ── Spaceghost visual system ───────────────────────────────────────────────────
# Background #0b0d16 | surface #161a2b | violet #b4a1ff | mint #79efc2
# White #e8edf7 | muted #8992ad | warning #f3c969 | alert #ff7597
set -g status-position top
set -g status 2
set -g status-interval 5
set -g status-justify left
set -g status-style 'bg=#0b0d16,fg=#8992ad'
set -g status-left-style 'none'
set -g status-right-style 'none'
set -g status-left-length 46
set -g status-right-length 60
# Only the active window receives the solid ion-mint treatment.
# Compress chrome on smaller screens so the window list keeps the space.
set -g status-left '#[bg=#b4a1ff,fg=#0b0d16,bold] #{?#{e|>=:#{client_width},160},S P A C E G H O S T,#{?#{e|>=:#{client_width},100},SPACEGHOST,SG}} #[bg=#161a2b,fg=#e8edf7,nobold] #{=/12/…:session_name} #[bg=#0b0d16] '
set -g status-right '#{?#{==:#{client_key_table},spaceghost-resize},#[bg=#b4a1ff,fg=#0b0d16,bold] RESIZE / q exit ,#{?client_prefix,#[bg=#f3c969,fg=#0b0d16,bold] CTRL-A ,#{?pane_in_mode,#[bg=#b4a1ff,fg=#0b0d16,bold] COPY ,#{?window_zoomed_flag,#[bg=#79efc2,fg=#0b0d16,bold] ZOOM ,}}}}#[bg=#0b0d16,fg=#8992ad,nobold]#{?#{e|>=:#{client_width},150}, #h /,} #[fg=#e8edf7,bold]%H:%M #[fg=#8992ad,nobold]#{?#{e|>=:#{client_width},180},%a %d %b ,}'

# Codex emits explicit state in its structured title; do not infer state from CPU.
# NEW (unread output) is independent: READY + NEW and QUIET + NEW are meaningful.
set -g @spaceghost-ready '#{m/r: [|] (Waiting|Ready) [|] codex$,#{pane_title}}'
set -g @spaceghost-busy '#{m/r: [|] (Working|Thinking) [|] codex$,#{pane_title}}'
set -g @spaceghost-state '#{?pane_dead,EXIT,#{?#{E:@spaceghost-ready},READY,#{?#{E:@spaceghost-busy},BUSY,#{?window_silence_flag,QUIET,LIVE}}}}'
set -g @spaceghost-state-color '#{?pane_dead,#ff7597,#{?#{E:@spaceghost-ready},#79efc2,#{?#{E:@spaceghost-busy},#b4a1ff,#8992ad}}}'
# Strip Codex's user/state suffix; a manually renamed window takes precedence.
set -g @spaceghost-task '#{?automatic-rename,#{?#{m:* | * | * | codex,#{pane_title}},#{s/ [|].*$//:pane_title},#{?#{==:#{pane_title},#{host_short}},#{window_name},#{pane_title}}},#{window_name}}'
set -g @spaceghost-tab '#{?#{e|>=:#{client_width},180},#{=/26/…:#{E:@spaceghost-task}},#{=/14/…:#{E:@spaceghost-task}}}'
setw -g window-status-separator ' '
setw -g window-status-style 'bg=#0b0d16,fg=#8992ad'
setw -g window-status-format '#[bg=#{?window_activity_flag,#292338,#0b0d16},fg=#{?window_activity_flag,#e8edf7,#8992ad}] #I #{E:@spaceghost-tab} #[fg=#{E:@spaceghost-state-color}]#{E:@spaceghost-state}#{?window_activity_flag, #[fg=#f3c969]#[bold]NEW#[nobold],}#{?window_bell_flag, #[fg=#ff7597]!,} '
setw -g window-status-current-style 'bg=#79efc2,fg=#0b0d16,bold'
setw -g window-status-current-format ' #I / #{E:@spaceghost-tab}  NOW / #{E:@spaceghost-state}#{?window_zoomed_flag, +ZOOM,} '
setw -g window-status-activity-style 'fg=#f3c969'
setw -g window-status-bell-style 'fg=#ff7597,bold'
setw -g window-status-last-style 'default'

# Row one keeps tmux's native clickable, scrolling window list.
# Row two is context + lightweight telemetry. No network calls or git dirty scans.
# q: shell-quotes the pane path; branch output is sanitized before status rendering.
set -g @spaceghost-branch "#({ git -C #{q:pane_current_path} symbolic-ref --quiet --short HEAD || git -C #{q:pane_current_path} rev-parse --short HEAD; } 2>/dev/null | LC_ALL=C tr -c 'A-Za-z0-9_./:\\n-' '?' | cut -c1-24)"
set -g @spaceghost-load "#(if test -r /proc/loadavg; then cut -d ' ' -f 1 /proc/loadavg; else sysctl -n vm.loadavg 2>/dev/null | cut -d ' ' -f 2; fi)"
set -g status-format[1] '#[fill=#161a2b,bg=#161a2b,fg=#8992ad,align=left] #[fg=#79efc2]#{pane_current_command} #[fg=#8992ad]/ #[fg=#e8edf7]#{?#{e|>=:#{client_width},140},#{=/-48/…:pane_current_path},#{=/-24/…:pane_current_path}} #{?#{e|>=:#{client_width},140},#[fg=#b4a1ff]#{E:@spaceghost-branch},}#[align=right,fg=#8992ad]#{?#{==:#{client_key_table},spaceghost-resize},#[fg=#b4a1ff]hjkl resize / HJKL fast / = balance / q exit ,#{?#{e|>=:#{client_width},190},LOAD #[fg=#e8edf7]#{E:@spaceghost-load}  ,}#{?#{e|>=:#{client_width},140},#[fg=#8992ad]PANE #[fg=#e8edf7]#P/#{window_panes}  ,}#[fg=#b4a1ff] ^A ^SPACE #{?#{e|>=:#{client_width},110},#[fg=#8992ad]/ command ,}}'

set -g pane-border-style 'fg=#30364f'
set -g pane-active-border-style 'fg=#{?pane_in_mode,#f3c969,#b4a1ff}'
set -g pane-border-lines single
set -g pane-border-indicators colour
set -g pane-border-status off
set -g pane-border-format '#{?pane_active,#[fg=#79efc2]#[bold],#[fg=#8992ad]} #P / #{pane_current_command} #[nobold]#{b:pane_current_path}#{?pane_marked, #[fg=#f3c969]MARKED,} '
set -g display-panes-colour '#8992ad'
set -g display-panes-active-colour '#79efc2'
set -g display-panes-time 1500
set -g message-style 'bg=#b4a1ff,fg=#0b0d16,bold'
set -g message-command-style 'bg=#161a2b,fg=#79efc2'
setw -g mode-style 'bg=#b4a1ff,fg=#0b0d16,bold'
set -g menu-style 'bg=#0b0d16,fg=#e8edf7'
set -g menu-selected-style 'bg=#b4a1ff,fg=#0b0d16,bold'
set -g menu-border-style 'fg=#b4a1ff'
set -g menu-border-lines rounded
set -g popup-style 'bg=#0b0d16,fg=#e8edf7'
set -g popup-border-style 'fg=#b4a1ff'
set -g popup-border-lines rounded
setw -g clock-mode-colour '#79efc2'
setw -g clock-mode-style 24
