name: Superhold release preparation
on:
  push:
    paths: ['projects/superhold/**', '.github/workflows/superhold.yml']
  pull_request:
    paths: ['projects/superhold/**', '.github/workflows/superhold.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    container: python:${{ matrix.python }}-alpine
    defaults:
      run:
        shell: sh
        working-directory: projects/superhold
    strategy:
      matrix:
        python: ['3.10', '3.14']
    steps:
      - name: Check out the public source revision
        working-directory: .
        run: |
          apk add --no-cache git
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Install build frontend
        run: python -m pip install build
      - name: Build wheel and source archive
        run: python -m build
      - name: Record artifact checksums
        run: sha256sum dist/*.whl dist/*.tar.gz
