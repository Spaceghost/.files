[main]
selection-target=both
term=xterm-256color
font=DejaVu Sans Mono:size=9
font-bold=DejaVu Sans Mono:style=Bold:size=9
font-italic=DejaVu Sans Mono:style=Italic:size=9
shell=/bin/bash
pad=2x2 center
resize-delay-ms=40
initial-color-theme=dark

# Gruvbox Dark: warm charcoal, cream text, and the original 16-color palette.
[colors-dark]
alpha=1.0
alpha-mode=all
foreground=fbf1c7
background=282828
selection-foreground=fbf1c7
selection-background=504945
regular0=282828
regular1=cc241d
regular2=98971a
regular3=d79921
regular4=458588
regular5=b16286
regular6=689d6a
regular7=ebdbb2
bright0=bdae93
bright1=fb4934
bright2=b8bb26
bright3=fabd2f
bright4=83a598
bright5=d3869b
bright6=8ec07c
bright7=ebdbb2
cursor=282828 fabd2f
urls=83a598
jump-labels=282828 fabd2f
scrollback-indicator=282828 83a598
search-box-no-match=282828 fb4934
search-box-match=282828 b8bb26

[csd]
preferred=server
# Matching fallback when another Wayland compositor supplies no decorations.
size=18
font=DejaVu Sans:size=9
color=ff282828
border-width=0
border-color=ff504945
button-color=ffebdbb2
button-minimize-color=ff83a598
button-maximize-color=ffb8bb26
button-close-color=fffb4934

# Shared terminal shortcuts (also configured for Ghostty).
[scrollback]
lines=5000

[key-bindings]
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
search-start=Control+Shift+f
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0
scrollback-up-page=Shift+Page_Up
scrollback-down-page=Shift+Page_Down
