# Compact launcher for the 480x320 panel.
[main]
font=DejaVu Sans Mono:size=10
dpi-aware=no
prompt="Apps > "
placeholder=Type to search
icons-enabled=no
image-size-ratio=0
terminal=foot -e
anchor=center
width=36
lines=5
line-height=22
horizontal-pad=14
vertical-pad=12
inner-pad=8
layer=overlay
match-mode=fzf
fields=name,generic,keywords
show-actions=no

[colors]
background=282828ff
text=ebdbb2ff
prompt=fabd2fff
placeholder=928374ff
input=fbf1c7ff
match=8ec07cff
selection=504945ff
selection-text=fbf1c7ff
selection-match=fabd2fff
border=bdae93ff

[border]
width=1
radius=6
