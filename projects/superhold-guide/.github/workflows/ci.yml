name: Superhold
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    container: python:${{ matrix.python }}-alpine
    defaults:
      run:
        shell: sh
    strategy:
      matrix:
        python: ['3.10', '3.14']
    steps:
      - name: Check out the public source revision
        run: |
          apk add --no-cache git libxkbcommon
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Install build frontend
        run: python -m pip install build
      - name: Build wheel and source archive
        run: python -m build
      - name: Record artifact checksums
        run: sha256sum dist/*.whl dist/*.tar.gz
